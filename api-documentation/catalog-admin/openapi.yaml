  # ----------------------------------------------------------------
  # External resources
  # ----------------------------------------------------------------

  /datasets/{datasetIDNo}/resources:
    get:
      tags:
        - External resources
      summary: List resources
      description: Get a list of all external resources for a dataset
      operationId: listStudyResources
      parameters:
        - name: datasetIDNo
          in: path
          required: true
          description: Dataset IDNo
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
    post:
      tags:
        - External resources
      summary: Add a resource
      description: |
        Creates a new external resource. You can either:
          - Upload a file using the '`Upload file`' endpoint, then provide the `filename` or `upload_id` here.
          - Or, provide a direct file upload in the request (multipart/form-data).

        **Resumable Uploads:**
          - Use the `/api/uploads` endpoints to upload a file in chunks and obtain an `upload_id`.
          - Pass the `upload_id` in the request body to associate the uploaded file with the resource.
          - If both a file and an `upload_id` are provided, `upload_id` takes precedence.

        **Full File Uploads:**
          - You may still upload a file directly as before.

        **Required fields:**
          - `title` (string)
          - `filename` (string, if not using `upload_id`)
          - `upload_id` (string, if using resumable upload)

        For uploading files, see the '`Upload file`' endpoint. Make sure the file name matches the `filename` provided here, or use the `upload_id` from the resumable upload API.
      operationId: addDatasetResources
      parameters:
        - name: datasetIDNo
          in: path
          required: true
          description: Dataset IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  description: Resource title
                filename:
                  type: string
                  description: File name (required if not using upload_id)
                upload_id:
                  type: string
                  description: Upload ID from resumable upload API (optional, takes precedence if provided)
                dctype:
                  type: string
                  description: Resource type
                dcformat:
                  type: string
                  description: Resource format
          multipart/form-data:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  description: Resource title
                filename:
                  type: string
                  description: File name
                upload_id:
                  type: string
                  description: Upload ID from resumable upload API
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '200':
          description: Successful operation
    delete:
      tags:
        - External resources
      summary: Delete resource
      description: Delete a single resource
      operationId: deleteResource
      parameters:
        - name: datasetIDNo
          in: path
          required: true
          description: Dataset IDNo
          schema:
            type: string
        - name: resourceId
          in: path
          required: true
          description: Resource ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation

