  /admin/timeseries/data/import:
    post:
      tags:
        - Timeseries Admin
      summary: Import project timeseries CSV
      description: >
        Replaces all indicator observations for the study in MongoDB (always overwrite).
        Supply the CSV either as a direct multipart `file` or as a completed resumable `upload_id`
        from `POST /uploads/init` and `POST /uploads/chunk/{upload_id}` — not both.
        Large files from external systems (e.g. Metadata Editor DuckDB export) should use `upload_id`.
      operationId: timeseriesAdminDataImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [idno]
              properties:
                idno:
                  type: string
                  description: Catalogue study idno (`surveys.idno`).
                file:
                  type: string
                  format: binary
                  description: CSV file (required unless `upload_id` is provided).
                upload_id:
                  type: string
                  description: >
                    Completed resumable upload session id from `/uploads/*` (required unless `file`
                    is provided). The assembled file must be CSV.
                delimiter:
                  type: string
                  example: ","
                mapping:
                  type: string
                  description: JSON object mapping CSV headers to DSD component names.
                ensure_unique_index:
                  type: string
                  enum: ['0', '1']
                dsd_idno:
                  type: string
                  description: >
                    Optional catalogue DSD idno. When set, the server persists the study→DSD link
                    (same as POST .../attach-dsd with data_structure_reference) before importing.
                    Omit when the project is already linked.
      responses:
        '201':
          description: Import completed

