  # ----------------------------------------------------------------
  # Catalog import
  # ----------------------------------------------------------------

  /admin/catalog/ddi_upload_collections:
    get:
      tags:
        - Catalog import
      summary: List collections available for study import
      description: >-
        Returns collections (repositories) the authenticated user may import into, based on admin catalog scope
        and `study.create` permission. Used by the admin upload UI; optional for API clients that already know `repositoryid`.
      operationId: catalogDdiUploadCollections
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDdiUploadCollectionsResponse'
        '403':
          $ref: '#/components/responses/CatalogImportForbidden'

  /admin/catalog/import:
    post:
      tags:
        - Catalog import
      summary: Import study from file (one-shot)
      description: >-
        Upload a metadata file and create or update a study in one request. Format is auto-detected:

        - `.xml` with root `codeBook` — DDI microdata (`DDI2_import`)
        - `.xml` with root `MD_Metadata` / `MI_Metadata` — geospatial
        - `.json` — dataset metadata document (`Catalog_dataset_import`)
        - `.jsonl` — line 1 = study document, further lines = variables
        - `.zip` — study package (same layout as package export); full import in one request

        For large package ZIP files, prefer staged import via `/admin/catalog/import_package/*` after a resumable upload.

        Optional multipart field `rdf` — RDF file imported after DDI survey XML import.
      operationId: catalogImportOneShot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, repositoryid]
              properties:
                file:
                  type: string
                  format: binary
                  description: Metadata file (`.xml`, `.json`, `.jsonl`, or `.zip`)
                repositoryid:
                  type: string
                  description: Target collection id (e.g. `central`)
                  default: central
                overwrite:
                  type: string
                  enum: [yes, no]
                  description: Replace existing study with same IDNO when `yes`
                published:
                  type: integer
                  enum: [0, 1]
                  description: Published flag; only applied when sent
                access_policy:
                  type: string
                  description: Data access form/model code; sets `formid` when it resolves
                data_remote_url:
                  type: string
                  description: Remote data access URL (`link_da`)
                rdf:
                  type: string
                  format: binary
                  description: Optional RDF file (survey DDI import only)
      responses:
        '200':
          description: Import succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportOneShotResponse'
        '400':
          $ref: '#/components/responses/CatalogImportValidationError'
        '403':
          $ref: '#/components/responses/CatalogImportForbidden'

  /admin/catalog/import_package/status:
    get:
      tags:
        - Catalog import
      summary: Get staged package import status
      description: >-
        Returns import progress for a completed resumable upload. Use `next_task` to determine the next endpoint to call.
        Safe to call after page reload or API client restart.
      operationId: catalogImportPackageStatus
      parameters:
        - name: upload_id
          in: query
          required: true
          description: Resumable upload session id (`/uploads/*`)
          schema:
            type: string
      responses:
        '200':
          description: Import status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportPackageStatusResponse'
        '400':
          $ref: '#/components/responses/CatalogImportBadRequest'
        '403':
          $ref: '#/components/responses/CatalogImportForbidden'

  /admin/catalog/import_package/unzip:
    post:
      tags:
        - Catalog import
      summary: Staged package import — extract ZIP
      description: >-
        Extract the uploaded package ZIP to a server temp directory, read `info.json` and JSONL, and prepare per–data-file
        variable sidecar files (survey/microdata). Idempotent if already extracted for this `upload_id`.
      operationId: catalogImportPackageUnzip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImportPackageUploadRequest'
      responses:
        '200':
          description: Extract completed or already done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportPackageStatusResponse'
        '400':
          $ref: '#/components/responses/CatalogImportBadRequest'
        '403':
          $ref: '#/components/responses/CatalogImportForbidden'

  /admin/catalog/import_package/create:
    post:
      tags:
        - Catalog import
      summary: Staged package import — create study metadata
      description: >-
        Create the study from JSONL line 1 (study-level metadata, data file definitions, variable groups).
        Does **not** import variables; use `datafile` for that. Uses the same validation and type resolution as one-shot JSON import.
      operationId: catalogImportPackageCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImportPackageCreateRequest'
      responses:
        '200':
          description: Study created or already exists for this import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportPackageStatusResponse'
        '400':
          $ref: '#/components/responses/CatalogImportValidationError'
        '403':
          $ref: '#/components/responses/CatalogImportForbidden'

  /admin/catalog/import_package/datafile:
    post:
      tags:
        - Catalog import
      summary: Staged package import — import next data file
      description: >-
        Import **one** data file and **all** variables for that `file_id` atomically (no partial variable import).
        Call repeatedly until `data_files_pending` is empty. Survey/microdata only; non-survey packages skip this step.
      operationId: catalogImportPackageDatafile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImportPackageUploadRequest'
      responses:
        '200':
          description: Data file imported, or all data files already complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportPackageStatusResponse'
        '400':
          $ref: '#/components/responses/CatalogImportValidationError'
        '403':
          $ref: '#/components/responses/CatalogImportForbidden'

  /admin/catalog/import_package/finalize:
    post:
      tags:
        - Catalog import
      summary: Staged package import — finalize
      description: >-
        Copy package assets (DDI/XML, documentation, external resources, thumbnail, RDF), rebuild search indexes,
        and remove temp extract files. Returns `sid` and `package_stats` when complete.
      operationId: catalogImportPackageFinalize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImportPackageUploadRequest'
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportPackageFinalizeResponse'
        '400':
          $ref: '#/components/responses/CatalogImportBadRequest'
        '403':
          $ref: '#/components/responses/CatalogImportForbidden'

  /admin/catalog/{idno}/package:
    get:
      tags:
        - Catalog import
      summary: Export study package ZIP
      description: >-
        Download a study package ZIP produced by `Package_Exporter`. Import via one-shot `/admin/catalog/import`
        or staged `/admin/catalog/import_package/*` after resumable upload.

        ZIP contents: `info.json`, `{idno}.jsonl`, optional DDI/XML, `external_resources.json`, `documentation/*`, thumbnail.
      operationId: catalogExportPackage
      parameters:
        - $ref: '#/components/parameters/AdminCatalogStudyIdno'
        - $ref: '#/components/parameters/AdminCatalogStudyIdFormat'
        - name: dsd_export
          in: query
          description: Timeseries DSD export mode in JSONL (`reference` default, or `inline`)
          schema:
            type: string
            enum: [reference, inline]
            default: reference
      responses:
        '200':
          description: Package ZIP file
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/CatalogImportBadRequest'
        '403':
          $ref: '#/components/responses/CatalogImportForbidden'

  # ----------------------------------------------------------------
  # Study admin metadata
  # ----------------------------------------------------------------

  /admin/catalog/{idno}/admin-metadata:
    get:
      tags:
        - Study admin metadata
      summary: Get study admin metadata
      description: >-
        Returns admin-only metadata attached to a study. When no record exists, `metadata` is an empty object.
        Study reference is the dataset IDNO by default; pass query `id_format=id` to use numeric `surveys.id`.
      operationId: studyAdminMetadataGet
      parameters:
        - $ref: '#/components/parameters/AdminCatalogStudyIdno'
        - $ref: '#/components/parameters/AdminCatalogStudyIdFormat'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAdminMetadataResponse'
        '400':
          $ref: '#/components/responses/StudyAdminMetadataBadRequest'
        '403':
          $ref: '#/components/responses/StudyAdminMetadataForbidden'
    post:
      tags:
        - Study admin metadata
      summary: Create study admin metadata
      description: >-
        Creates admin metadata for a study. Request body must include a `metadata` object.
        If metadata already exists for the study, the request fails with `409` unless `overwrite` is set
        (in the JSON body or query string), in which case the stored document is replaced.
      operationId: studyAdminMetadataCreate
      parameters:
        - $ref: '#/components/parameters/AdminCatalogStudyIdno'
        - $ref: '#/components/parameters/AdminCatalogStudyIdFormat'
        - $ref: '#/components/parameters/StudyAdminMetadataOverwrite'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyAdminMetadataSaveRequest'
      responses:
        '200':
          description: Created or replaced (when overwrite is set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAdminMetadataResponse'
        '400':
          $ref: '#/components/responses/StudyAdminMetadataBadRequest'
        '403':
          $ref: '#/components/responses/StudyAdminMetadataForbidden'
        '409':
          description: Metadata already exists and overwrite was not set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAdminMetadataErrorResponse'
              example:
                status: failed
                message: METADATA_ALREADY_EXISTS
    delete:
      tags:
        - Study admin metadata
      summary: Delete study admin metadata
      description: Removes the admin metadata record for a study (no-op if none exists).
      operationId: studyAdminMetadataDelete
      parameters:
        - $ref: '#/components/parameters/AdminCatalogStudyIdno'
        - $ref: '#/components/parameters/AdminCatalogStudyIdFormat'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAdminMetadataDeleteResponse'
        '400':
          $ref: '#/components/responses/StudyAdminMetadataBadRequest'
        '403':
          $ref: '#/components/responses/StudyAdminMetadataForbidden'

  /admin/catalog/{idno}/admin-metadata/update:
    post:
      tags:
        - Study admin metadata
      summary: Replace study admin metadata
      description: >-
        Replaces the entire admin metadata document for a study (inserts if none exists).
        POST alias for environments that cannot send PUT. Same JSON body as create.
      operationId: studyAdminMetadataUpdate
      parameters:
        - $ref: '#/components/parameters/AdminCatalogStudyIdno'
        - $ref: '#/components/parameters/AdminCatalogStudyIdFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyAdminMetadataSaveRequest'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAdminMetadataResponse'
        '400':
          $ref: '#/components/responses/StudyAdminMetadataBadRequest'
        '403':
          $ref: '#/components/responses/StudyAdminMetadataForbidden'

  /admin/catalog/{idno}/admin-metadata/delete:
    post:
      tags:
        - Study admin metadata
      summary: Delete study admin metadata (POST alias)
      description: >-
        Same as `DELETE /admin/catalog/{idno}/admin-metadata`. Provided for environments that cannot send DELETE.
      operationId: studyAdminMetadataDeletePost
      parameters:
        - $ref: '#/components/parameters/AdminCatalogStudyIdno'
        - $ref: '#/components/parameters/AdminCatalogStudyIdFormat'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAdminMetadataDeleteResponse'
        '400':
          $ref: '#/components/responses/StudyAdminMetadataBadRequest'
        '403':
          $ref: '#/components/responses/StudyAdminMetadataForbidden'

# ----------------------------------------------------------------
# Search metadata extract
# ----------------------------------------------------------------

  /admin/search-metadata-extract/status:
    get:
      tags:
        - Search metadata extract
      summary: Indexer status / counts
      description: Returns total study and citation counts for external indexer bootstrapping.
      operationId: searchMetadataExtractStatus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMetadataExtractStatusResponse'
        '403':
          $ref: '#/components/responses/SearchMetadataExtractForbidden'

  /admin/search-metadata-extract/studies:
    get:
      tags:
        - Search metadata extract
      summary: Batch list studies
      description: |
        Returns a paginated list of study documents for external indexing.

        Use `offset` + `limit` to page through the full catalog.
        Filter by one or more dataset types with the `type` parameter.
      operationId: searchMetadataExtractStudiesList
      parameters:
        - name: offset
          in: query
          description: Number of records to skip (default 0)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          description: Page size (default 50, max 100)
          schema:
            type: integer
            default: 50
            maximum: 100
            minimum: 1
        - name: type
          in: query
          description: |
            Filter by dataset type. Comma-separated list of one or more values.
            When omitted, all types are returned.
          schema:
            type: string
            example: timeseries,survey
          examples:
            single:
              summary: Single type
              value: timeseries
            multiple:
              summary: Multiple types
              value: survey,timeseries,geospatial
        - name: include_metadata
          in: query
          description: Include full raw metadata JSON in each study document (default false)
          schema:
            type: boolean
            default: false
        - name: include_admin_metadata
          in: query
          description: Include admin-only metadata in each study document (default false)
          schema:
            type: boolean
            default: false
        - name: include_resources
          in: query
          description: Include external resources array in each study document (default false)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMetadataExtractStudiesBatchResponse'
        '403':
          $ref: '#/components/responses/SearchMetadataExtractForbidden'

  /admin/search-metadata-extract/studies/{idno}:
    get:
      tags:
        - Search metadata extract
      summary: Get single study
      description: Returns the full extract document for a single study by IDNO (or numeric ID when `id_format=id`).
      operationId: searchMetadataExtractStudyGet
      parameters:
        - name: idno
          in: path
          required: true
          description: Study IDNO (default) or numeric `surveys.id` when `id_format=id`
          schema:
            type: string
        - name: id_format
          in: query
          description: Set to `id` to use numeric `surveys.id` instead of IDNO
          schema:
            type: string
            enum: [id]
        - name: include_metadata
          in: query
          description: Include full raw metadata JSON (default false)
          schema:
            type: boolean
            default: false
        - name: include_admin_metadata
          in: query
          description: Include admin-only metadata (default false)
          schema:
            type: boolean
            default: false
        - name: include_resources
          in: query
          description: Include external resources array (default false)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMetadataExtractStudySingleResponse'
        '403':
          $ref: '#/components/responses/SearchMetadataExtractForbidden'
        '404':
          $ref: '#/components/responses/SearchMetadataExtractNotFound'

  /admin/search-metadata-extract/citations/{id}:
    get:
      tags:
        - Search metadata extract
      summary: Get single citation
      description: Returns the extract document for a single citation by numeric ID.
      operationId: searchMetadataExtractCitationGet
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric `citations.id`
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMetadataExtractCitationResponse'
        '403':
          $ref: '#/components/responses/SearchMetadataExtractForbidden'
        '404':
          $ref: '#/components/responses/SearchMetadataExtractNotFound'

# ----------------------------------------------------------------
# Security & Components
# ----------------------------------------------------------------

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-KEY
      in: header

  parameters:
    AnalyticsDateFrom:
      name: date_from
      in: query
      description: Filter from date (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
    AnalyticsDateTo:
      name: date_to
      in: query
      description: Filter to date (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
    AnalyticsStudyId:
      name: study_id
      in: query
      description: Filter by study ID
      schema:
        type: string
    AnalyticsLimit:
      name: limit
      in: query
      description: Page size (default 50)
      schema:
        type: integer
        default: 50
    AnalyticsOffset:
      name: offset
      in: query
      description: Pagination offset (default 0)
      schema:
        type: integer
        default: 0
    AnalyticsYear:
      name: year
      in: query
      description: Filter by year
      schema:
        type: integer
    AnalyticsMonth:
      name: month
      in: query
      description: Filter by month (1–12)
      schema:
        type: integer
        minimum: 1
        maximum: 12
    AnalyticsExportFormat:
      name: format
      in: query
      description: Export format (default `csv`)
      schema:
        type: string
        enum: [csv, json]
        default: csv
    AdminCatalogStudyIdno:
      name: idno
      in: path
      required: true
      description: Study IDNO (default) or numeric `surveys.id` when `id_format=id`
      schema:
        type: string
    AdminCatalogStudyIdFormat:
      name: id_format
      in: query
      description: Set to `id` to use numeric `surveys.id` instead of IDNO in the path
      schema:
        type: string
        enum: [id]
    StudyAdminMetadataOverwrite:
      name: overwrite
      in: query
      description: >-
        When true, replace existing admin metadata instead of failing with `409`.
        May also be sent in the JSON request body.
      schema:
        type: boolean
        default: false

  responses:
    AnalyticsBadRequest:
      description: Bad request or server error message
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsErrorResponse'
    AnalyticsForbidden:
      description: Admin access required (`ACCESS-DENIED`)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: failed
              message:
                type: string
                example: ACCESS-DENIED
    CatalogImportForbidden:
      description: Admin catalog access denied or upload not owned by caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogImportErrorResponse'
          example:
            status: error
            message: ACCESS_DENIED
    CatalogImportBadRequest:
      description: Invalid request (e.g. `UPLOAD_ID_REQUIRED`, `UPLOAD_NOT_COMPLETE_OR_MISSING`, `PACKAGE_NOT_UNZIPPED`, `DATAFILES_NOT_COMPLETE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogImportErrorResponse'
    CatalogImportValidationError:
      description: Validation failed (e.g. `VALIDATION_ERROR`, `INVALID_TYPE`, variable schema errors)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogImportValidationErrorResponse'
    StudyAdminMetadataBadRequest:
      description: Invalid request (e.g. `METADATA_REQUIRED`, `METADATA_MUST_BE_OBJECT`, `METADATA_TOO_LARGE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudyAdminMetadataErrorResponse'
    StudyAdminMetadataForbidden:
      description: Admin or study edit access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudyAdminMetadataErrorResponse'
          example:
            status: failed
            message: ACCESS_DENIED
    SearchMetadataExtractForbidden:
      description: Admin catalog access required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchMetadataExtractErrorResponse'
          example:
            status: failed
            message: ACCESS_DENIED
    SearchMetadataExtractNotFound:
      description: Study or citation not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchMetadataExtractErrorResponse'
          example:
            status: failed
            message: STUDY_NOT_FOUND

  schemas:
    DisplayTemplateJson:
      type: object
      description: |
        Metadata-editor / legacy display tree. Same schema as editor form templates and
        `application/templates/display/*_display_template.json` files. Section containers and
        sections nest via `items[]`; array fields define columns in `props[]`. Fields may include
        `display_type` and `display_options` for public study pages.
      required: [type, items]
      properties:
        type:
          type: string
          enum: [template]
          example: template
        title:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    TemplateRecord:
      type: object
      properties:
        uid:
          type: string
        template_type:
          type: string
          enum: [system, custom, imported]
        data_type:
          type: string
        name:
          type: string
        version:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]
        template_json:
          $ref: '#/components/schemas/DisplayTemplateJson'
        default:
          type: boolean
          nullable: true

    TemplateWriteRequest:
      type: object
      required: [data_type, name, template_json]
      properties:
        uid:
          type: string
        template_type:
          type: string
          enum: [system, custom, imported]
        data_type:
          type: string
        name:
          type: string
        version:
          type: string
        organization:
          type: string
        author:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        template_json:
          $ref: '#/components/schemas/DisplayTemplateJson'

    TemplateUpdateRequest:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        organization:
          type: string
        author:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        template_json:
          $ref: '#/components/schemas/DisplayTemplateJson'

    TemplateImportRequest:
      type: object
      description: |
        Import a display template from JSON. `data_type` and `name` are taken from the imported file when present
        (legacy display export envelope). Optional body fields may override envelope values for programmatic imports.
      properties:
        uid:
          type: string
        template_type:
          type: string
          enum: [system, custom, imported]
        data_type:
          description: Optional override; normally read from imported JSON (`data_type` on export envelope).
          type: string
        name:
          description: Optional override; normally read from imported JSON (`name` on export envelope or `title` in tree).
          type: string
        version:
          type: string
        organization:
          type: string
        author:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        copy_if_uid_exists:
          type: boolean
          description: |
            When true and the imported file includes a `uid` that already exists, create a new template with a
            generated UID (name suffixed with " - copy"). When false, import fails with a duplicate UID error.
        template:
          description: |
            Import payload: display export envelope (`{ data_type, name, template: { type, items[] } }`)
            or a bare form tree (`{ type, title, items[] }`). May also POST the envelope as the request body root.
          type: object
          additionalProperties: true
        template_json:
          $ref: '#/components/schemas/DisplayTemplateJson'

    TemplateSingleResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        result:
          type: object
          properties:
            template:
              $ref: '#/components/schemas/TemplateRecord'

    TemplatesListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        result:
          type: object
          properties:
            templates:
              type: array
              items:
                $ref: '#/components/schemas/TemplateRecord'

    TemplateImportResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        result:
          type: object
          properties:
            template:
              $ref: '#/components/schemas/TemplateRecord'
            import_summary:
              type: object
              properties:
                total_nodes:
                  type: integer
                total_sections:
                  type: integer
                total_fields:
                  type: integer
                warnings:
                  type: array
                  items:
                    type: string

    TemplateValidateRequest:
      type: object
      required: [template_json]
      properties:
        template_json:
          $ref: '#/components/schemas/DisplayTemplateJson'

    TemplateValidateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        result:
          type: object
          properties:
            valid:
              type: boolean
            errors:
              type: array
              items:
                type: string

    RendererRecord:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        supported_source_types:
          type: array
          items:
            type: string
        handler:
          type: object
          additionalProperties: true
        default_params:
          type: object
          additionalProperties: true
        params:
          type: object
          additionalProperties: true
        supports_layout_builder:
          type: boolean
        status:
          type: string

    RenderersListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        result:
          type: object
          properties:
            renderers:
              type: array
              items:
                $ref: '#/components/schemas/RendererRecord'

    DataStructureStatusCode:
      type: string
      description: >-
        Catalogue DSD lifecycle slug (persisted as an integer in `data_structures.status`):
        `draft`, `review`, `published` (locked from destructive edits), `deprecated`,
        `archived` (locked). Request bodies and import JSON must use these strings. The
        list endpoint `GET /admin/data_structures` also accepts legacy numeric strings
        `0`, `10`, `20`, `30`, `40` for the `status` query filter only.
      enum: [draft, review, published, deprecated, archived]

    CodelistImportItem:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable code value (max 64 chars).
        label:
          type: string
          description: Display label; mapped to item title on import.
        title:
          type: string
          description: Alternate title field accepted by the importer.
        sort_order:
          type: integer
          default: 0
        parent_id:
          type: integer
          nullable: true

    CodelistImportPayload:
      type: object
      properties:
        idno:
          type: string
          description: Preferred stable codelist idno.
        name:
          type: string
          description: Codelist name (required when creating a new codelist).
        agency:
          type: string
          default: NADA
        version:
          type: string
          default: 1.0.0
        description:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CodelistImportItem'

    CodelistImportJsonRequest:
      type: object
      required: [codelist]
      properties:
        overwrite:
          type: boolean
          default: false
          description: Replace existing item set when matched codelist exists (body only; not a query flag).
        dry_run:
          type: boolean
          default: false
          description: Validate and resolve action without writing changes (body only; not a query flag).
        codelist:
          $ref: '#/components/schemas/CodelistImportPayload'

    CodelistImportJsonResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        result:
          type: object
          properties:
            dry_run:
              type: boolean
            codelist:
              type: object
