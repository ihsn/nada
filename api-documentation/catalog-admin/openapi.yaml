      summary: Stop aggregation
      description: Request stop of the current aggregation run. Admin only.
      operationId: analyticsAggregateStop
      responses:
        '200':
          description: Stop acknowledged (check `status` and `message` in body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, error]
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/legacy/studies:
    get:
      tags:
        - Analytics
      summary: List legacy study totals
      description: >-
        Returns all-time (legacy) study totals stored with `year=0, month=0`.
        These are pre-analytics historical counts migrated from the surveys table.
        Optionally filtered by `study_id`. Admin only.
      operationId: analyticsLegacyStudiesGet
      parameters:
        - $ref: '#/components/parameters/AnalyticsStudyId'
        - $ref: '#/components/parameters/AnalyticsLimit'
        - $ref: '#/components/parameters/AnalyticsOffset'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsPaginatedListResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'
    post:
      tags:
        - Analytics
      summary: Set legacy study totals
      description: >-
        Upsert caller-provided all-time totals (`year=0, month=0`) for one or more studies.
        Accepts a JSON array. Each item's `study_id` may be an IDNO string (default) or a
        numeric database id (add `?id_format=id`). Directly writes the supplied values —
        does **not** aggregate from monthly data. Returns per-item results and errors. Admin only.
      operationId: analyticsLegacyStudiesPost
      parameters:
        - name: id_format
          in: query
          description: Set to `id` to treat `study_id` as a numeric database id instead of IDNO
          schema:
            type: string
            enum: [id]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsLegacyStudyInput'
      responses:
        '200':
          description: All or partial records updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsLegacyStudyResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/legacy/files:
    get:
      tags:
        - Analytics
      summary: List legacy file totals
      description: >-
        Returns all-time (legacy) file download totals stored with `year=0, month=0`.
        Optionally filtered by `study_id`. Admin only.
      operationId: analyticsLegacyFilesGet
      parameters:
        - $ref: '#/components/parameters/AnalyticsStudyId'
        - $ref: '#/components/parameters/AnalyticsLimit'
        - $ref: '#/components/parameters/AnalyticsOffset'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsPaginatedListResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  # ----------------------------------------------------------------
  # Data structures (admin)
  # ----------------------------------------------------------------

  /admin/data_structures:
    get:
      tags:
        - Data Structures
      summary: List data structures
      description: List global DSDs. Supports collapsed or flat list and optional pagination.
      operationId: dataStructuresList
      parameters:
        - name: flat
          in: query
          schema:
            type: boolean
          description: When true, return one row per version.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
          description: 1-based page number. When provided, returns paginated payload.
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: search
          in: query
          schema:
            type: string
          description: Search across title/name/agency/idno/version/description/notes.
        - name: q
          in: query
          schema:
            type: string
          description: Alias for `search`.
        - name: status
          in: query
          description: Exact status code filter (`DataStructureStatusCode`).
          schema:
            $ref: '#/components/schemas/DataStructureStatusCode'
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'

  /admin/data_structures/create:
    post:
      tags:
        - Data Structures
      summary: Create data structure
      description: >-
        Create a global DSD identity row from JSON (metadata only). Body schema:
        `data-structure-schema.json#/definitions/data_structure_create`. To create
        components and codelists in one request, use `POST /admin/data_structures/import_json`
        (root envelope in the same schema file). Optional query `overwrite` updates an
        existing non-locked DSD matched by idno or identity (agency+name+version).
      operationId: dataStructuresCreate
      parameters:
        - name: overwrite
          in: query
          schema:
            type: boolean
          description: When true, overwrite an existing non-locked DSD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'data-structure-schema.json#/definitions/data_structure_create'
      responses:
        '200':
          description: Existing data structure overwritten
        '201':
          description: Data structure created
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'

  /admin/data_structures/import_json:
    post:
      tags:
        - Data Structures
      summary: Import data structure JSON
      description: >-
        Import global DSD, components and codelists from JSON. Body matches
        `data-structure-schema.json`: root `data_structure` (identity + `components`),
        optional boolean `overwrite` and `dry_run` on the same JSON object (no query
        flags). Legacy split body (`structure` + `components` + `import_options`) is
        not accepted.
      operationId: dataStructuresImportJson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'data-structure-schema.json'
      responses:
        '200':
          description: Validation/dry-run succeeded
        '201':
          description: Import completed
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'

  /admin/codelists/import_json:
    post:
      tags:
        - Codelists Admin
      summary: Import codelist JSON
      description: >-
        Import one codelist and its items using DSD-style resolution rules:
        match existing by idno first, then by name+agency+version; create when
        missing; optionally replace items when `overwrite=true`. Boolean `overwrite`
        and `dry_run` are supplied on the JSON body only (no query parameters).
      operationId: codelistsImportJson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodelistImportJsonRequest'
      responses:
        '200':
          description: >-
            Dry-run succeeded, or import completed without creating a new codelist
            (existing codelist reused, or items updated in place when applicable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodelistImportJsonResponse'
        '201':
          description: Import completed and a new codelist row was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodelistImportJsonResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'

  /admin/data_structures/import:
    post:
      tags:
        - Data Structures
      summary: Import data structure from SDMX XML
      description: Import SDMX-ML structure XML from multipart `file` or XML body.
      operationId: dataStructuresImportXml
      parameters:
        - name: overwrite_codelists
          in: query
          schema:
            type: boolean
        - name: dsd_id
          in: query
          schema:
            type: string
          description: Optional DataStructure @id selector when multiple are present in XML.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                overwrite_codelists:
                  type: string
                dsd_id:
                  type: string
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
      responses:
        '201':
          description: Import completed
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'

  /admin/data_structures/by_identity:
    get:
      tags:
        - Data Structures
      summary: Get data structure by identity
      operationId: dataStructuresByIdentity
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: agency
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
        - name: with_components
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Successful operation
        '404':
          description: Data structure not found

  /admin/data_structures/validate:
    post:
      tags:
        - Data Structures
      summary: Validate DSD payload or existing DSD
      description: >-
        Option A: `{ "data_structure_id": <id> }` for a persisted DSD. Option B:
        `{ "data_structure": { ...fields..., "components": [ ... ] } }` for a
        proposed import shape (same nested envelope as `import_json`).
      operationId: dataStructuresValidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Validation result
