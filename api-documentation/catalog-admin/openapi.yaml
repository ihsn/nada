openapi: '3.0.3'
info:
  description: >-
    The NADA REST API allows depositing data, catalog management and querying
    and exploring metadata.  You can find out more about NADA at
    [http://nada.ihsn.org](http://nada.ihsn.org).


    To use the API, you will require the '`API-KEY'`, see the section
    `Authentication`

  version: "5.5"
  title: NADA
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'

servers:
  - url: /index.php/api
    description: NADA API server

tags:
  - name: API keys
    description: The API requires `API-KEY` for all endpoints and will only work for 'ADMIN' user accounts only. To generate the API keys, use `auth/login` method.
  - name: Datasets
    description: Datasets represent all types of data such as Microdata, Timeseries, Geospatail, Scripts, etc.
  - name: External resources
    description: External resources follow the same workflow as on the NADA site administration. To create resources, either '`import RDF`' or use '`add resource`'. To upload files, use the endpoint '`Upload file`'. You cannot create a resource and upload a file at the same time.
  - name: Resumable uploads
    description: Endpoints for managing resumable file uploads, chunked uploads, upload status, and download.
  - name: Citations
    description: Citations represent the publications related to the datasets.
  - name: Filestore
    description: File storage for uploading and viewing images and other document types.
  - name: Widgets
    description: "Widgets are embeddable content such as charts, visualizations or any other content. Widgets require Bootstrap 4 with JQuery to work properly, make sure the following lines are included in Widget's HTML and set the page height in pixels e.g. &lt;body style=&quot;`height:500px`&quot;&gt;. \n\n`https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css` \n `https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js` \n `https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js`"
  - name: Analytics
    description: |
      Site analytics: raw pageview and download events, daily and monthly aggregates, CSV/JSON exports, and aggregation jobs.
      Endpoints require an admin user and `X-API-KEY` (same as other catalog-admin APIs).

x-tagGroups:
  - name: Authentication
    tags:
      - API keys
  - name: Catalog administration
    tags:
      - Collections
      - Datasets
      - External resources
      - Scripts
      - Survey
      - Timeseries
      - Timeseries database
      - Geospatial
      - Images
      - Videos
      - Documents
      - Tables
      - Visualizations
      - Citations
      - Filestore
      - Reports
      - Widgets
      - Resumable uploads
      - Analytics

security:
  - ApiKeyAuth: []

paths:

  # ----------------------------------------------------------------
  # Authentication
  # ----------------------------------------------------------------

  /auth/login:
    post:
      tags:
        - API keys
      summary: Get API Keys
      description: Get user API keys
      operationId: getApiKey
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: User email address
                password:
                  type: string
                  description: Password
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    description: The user ID
                  user_name:
                    type: string
                    description: The user name
                  api_keys:
                    type: array
                    description: API keys
                    items:
                      type: string

  /auth/create_api_key:
    post:
      tags:
        - API keys
      summary: Create API key
      description: Create a new API key
      operationId: createApiKey
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: User email address
                password:
                  type: string
                  description: Password
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    description: The user ID
                  user_name:
                    type: string
                    description: The user name
                  api_keys:
                    type: array
                    description: API keys
                    items:
                      type: string

  # ----------------------------------------------------------------
  # Collections
  # ----------------------------------------------------------------

  /collections:
    get:
      tags:
        - Collections
      summary: List all collections
      description: Returns a list of all collections
      operationId: listCollections
      parameters:
        - name: published
          in: query
          description: (Optional) Filter by published status - `0`=draft, `1`=published
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionList'

    post:
      tags:
        - Collections
      summary: Create collection
      description: Create a new collection
      operationId: postCollection
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [repositoryid, title, short_text, long_text, section, ispublished]
              properties:
                repositoryid:
                  type: string
                  description: Collection identifier containing numbers and letters only
                title:
                  type: string
                  description: Collection Title
                short_text:
                  type: string
                  description: A short description for the collection
                long_text:
                  type: string
                  description: Detailed collection description. This field supports basic html and image tags.
                thumbnail:
                  type: string
                  description: Upload an image file or provide path/url
                weight:
                  type: integer
                  description: Provide weight to arrange display of collection
                section:
                  type: integer
                  description: |
                    Section/Group. To see a list of sections available, see api endpoint `collections/sections`

                    * `2` = Regional collection

                    * `3` = Specialized collection
                ispublished:
                  type: integer
                  description: |
                    Set status to draft or published

                    * `0` = draft

                    * `1` = published
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'

  /collections/{repositoryId}:
    get:
      tags:
        - Collections
      summary: Get a single collection
      description: Get a single collection
      operationId: singleCollection
      parameters:
        - name: repositoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
            application/xml:
              schema:
                $ref: '#/components/schemas/Collection'

  /collections/update:
    post:
      tags:
        - Collections
      summary: Update collection
      description: Update collection by providing values for the fields that you want to update. For updating `repositoryid`, use the endpoint `collections/rename`
      operationId: updateCollection
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [repositoryid, title, short_text, long_text, ispublished]
              properties:
                repositoryid:
                  type: string
                  description: Collection identifier containing numbers and letters only
                title:
                  type: string
                  description: Collection Title
                short_text:
                  type: string
                  description: A short description for the collection
                long_text:
                  type: string
                  description: Detailed collection description. This field supports basic html and image tags.
                thumbnail:
                  type: string
                  description: Upload an image file or provide path/url
                weight:
                  type: integer
                  description: Provide weight to arrange display of collection
                section:
                  type: integer
                ispublished:
                  type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'

  /collections/rename:
    post:
      tags:
        - Collections
      summary: Rename collection
      description: Rename a collection ID
      operationId: renameCollection
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [old_repositoryid, new_repositoryid]
              properties:
                old_repositoryid:
                  type: string
                  description: Old ID for collection
                new_repositoryid:
                  type: string
                  description: New ID for collection
      responses:
        '200':
          description: Successful operation

  # ----------------------------------------------------------------
  # Datasets / Collections
  # ----------------------------------------------------------------

  /datasets/collections:
    get:
      tags:
        - Collections
      summary: List datasets by collections
      description: List all datasets with collection owner and all linked collections
      operationId: listDatasetsByCollections
      responses:
        '200':
          description: Successful operation
    post:
      tags:
        - Datasets
        - Collections
      summary: Attach studies to collections
      description: Attach studies to collections
      operationId: collectionStudies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionLinkStudies'
      responses:
        '200':
          description: Successful operation

  # ----------------------------------------------------------------
  # Datasets
  # ----------------------------------------------------------------

  /datasets:
    get:
      tags:
        - Datasets
      summary: List all datasets
      description: Returns a list of all datasets
      operationId: listDatasets
      parameters:
        - name: offset
          in: query
          description: Specify the starting row number
          schema:
            type: integer
        - name: limit
          in: query
          description: Specify number of rows to return. Default is 50 rows.
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'

  /datasets/{IDNo}:
    get:
      tags:
        - Datasets
      summary: Get a single dataset
      description: Get a single dataset by IDNo
      operationId: singleDataset
      parameters:
        - name: IDNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'
            application/xml:
              schema:
                $ref: '#/components/schemas/DatasetList'
    put:
      tags:
        - Datasets
      summary: Dataset options
      description: Set various options for dataset
      operationId: setDatasetOptions
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Dataset IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetOptions'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetOptions'
    delete:
      tags:
        - Datasets
      summary: Delete
      description: Delete dataset
      operationId: deleteDatasetByIDNo
      parameters:
        - name: IDNo
          in: path
          description: Dataset IDNo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad input

  /datasets/thumbnail/{IDNo}:
    post:
      tags:
        - Datasets
      summary: Upload thumbnail
      description: Add or update thumbnail
      operationId: attachThumbnail
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Dataset IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Upload an image file. Supported formats are jpg, jpeg and png
      responses:
        '200':
          description: Successful operation

  /datasets/owner_collection/{IDNo}:
    post:
      tags:
        - Datasets
      summary: Set owner collection
      description: Collection that owns the study
      operationId: datasetOwnerCollection
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Dataset IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection_idno]
              properties:
                collection_idno:
                  type: string
      responses:
        '200':
          description: Successful operation

  /datasets/find_by_id/{datasetID}:
    get:
      tags:
        - Datasets
      summary: Get a single dataset by ID
      description: Get a single dataset by numeric ID
      operationId: findDatasetByID
      parameters:
        - name: datasetID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'

  /datasets/delete_by_id/{datasetID}:
    delete:
      tags:
        - Datasets
      summary: Delete by ID
      description: Delete a dataset by numeric ID
      operationId: deleteDatasetByID
      parameters:
        - name: datasetID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation

  /datasets/replace_idno:
    post:
      tags:
        - Datasets
      summary: Replace IDNO
      description: Replace IDNO
      operationId: replaceIdno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceIdno'
      responses:
        '200':
          description: Successful operation

  # ----------------------------------------------------------------
  # Survey
  # ----------------------------------------------------------------

  /datasets/create/survey/{IDNo}:
    post:
      tags:
        - Survey
      summary: Create survey
      description: Create a new survey
      operationId: createSurvey
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Dataset IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'survey-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'survey-schema.json'

  /datasets/update/survey/{IDNo}:
    post:
      tags:
        - Survey
      summary: Update survey
      description: "Update survey's full or partial metadata. Only the fields provided are updated. For fields marked as required, cannot be set to empty values. \n \n **Example:** To update title, use: \n \n `{study_desc.titl_statement.title='new value for title'}`"
      operationId: updateSurvey
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Dataset IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'survey-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'survey-schema.json'

  /datasets/import_ddi:
    post:
      tags:
        - Survey
      summary: Import DDI
      description: Import a DDI 2 Codebook XML file
      operationId: importDDI
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Upload DDI XML file or provide a URL pointing to the XML file
                overwrite:
                  type: string
                  enum: [yes, no]
                  description: Overwrite existing survey with the same ID?
                repositoryid:
                  type: string
                  description: Collection identifier where the survey will be added to.
                access_policy:
                  type: string
                  description: |
                    Select the access policy suitable for your data.

                    * `direct` - Direct access

                    * `public` - Public access

                    * `licensed` - Licensed access, require users to register and submit request for access

                    * `enclave` - Data Enclave

                    * `remote` - Data available from remote repository

                    * `other` - Other
                  enum:
                    - open
                    - direct
                    - public
                    - licensed
                    - enclave
                    - remote
                    - other
                data_remote_url:
                  type: string
                  description: Link to the website where the data is available for 'Data available from remote repository'
                rdf:
                  type: string
                  format: binary
                  description: Upload external resources RDF file or provide a URL to the file
                published:
                  type: integer
                  description: Set project publish status. 0=draft, 1=published
      responses:
        '200':
          description: Successful operation

  /datasets/replace_ddi/{IDNo}:
    post:
      tags:
        - Survey
      summary: Replace DDI
      description: Replace DDI
      operationId: replaceDDI
      parameters:
        - name: IDNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Upload DDI XML file
      responses:
        '200':
          description: Successful operation

  /datasets/strip_ddi/{IDNo}/{options}:
    put:
      tags:
        - Survey
      summary: Strip DDI elements
      description: Remove metadata from the DDI file
      operationId: stripDDI
      parameters:
        - name: IDNo
          in: path
          required: true
          schema:
            type: string
          description: Dataset IDNo
        - name: options
          in: path
          required: true
          schema:
            type: string
          description: Options for removing metadata elements. Valid options are `summary_stats`, `variables`, `keep_basic`
      responses:
        '200':
          description: Successful operation

  /datasets/update_id/{datasetIDNo}/{newId}:
    put:
      tags:
        - Survey
      summary: Set Dataset ID
      description: Replace the dataset internal numeric database ID
      operationId: updateID
      parameters:
        - name: datasetIDNo
          in: path
          required: true
          schema:
            type: string
        - name: newId
          in: path
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Successful operation

  /datasets/generate_pdf/{datasetIDNo}:
    post:
      tags:
        - Survey
      summary: Generate PDF
      description: Generate PDF documentation for surveys
      operationId: generatePDF
      parameters:
        - name: datasetIDNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePDF'
      responses:
        '200':
          description: Successful operation

  # ----------------------------------------------------------------
  # Scripts
  # ----------------------------------------------------------------

  /datasets/create/script/{IDNo}:
    post:
      tags:
        - Scripts
      summary: Create script
      description: Create a new script project
      operationId: createScript
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Unique IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'script-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'script-schema.json'

  # ----------------------------------------------------------------
  # Geospatial
  # ----------------------------------------------------------------

  /datasets/create/geospatial:
    post:
      tags:
        - Geospatial
      summary: Create geospatial
      description: Create a new geospatial project
      operationId: createGeospatial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'geospatial-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'geospatial-schema.json'

  # ----------------------------------------------------------------
  # Timeseries database
  # ----------------------------------------------------------------

  /datasets/create/timeseriesdb:
    post:
      tags:
        - Timeseries database
      summary: Create timeseries database
      description: Create a new timeseries database
      operationId: createTimeseriesDB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'timeseries-db-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'timeseries-db-schema.json'

  /datasets/update/timeseriesdb/{IDNo}:
    post:
      tags:
        - Timeseries database
      summary: Update timeseries database
      description: Update timeseries database
      operationId: updateTimeseriesDB
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Unique IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'timeseries-db-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'timeseries-db-schema.json'

  # ----------------------------------------------------------------
  # Timeseries
  # ----------------------------------------------------------------

  /datasets/create/timeseries:
    post:
      tags:
        - Timeseries
      summary: Create timeseries dataset
      description: Create a new timeseries project
      operationId: createTimeSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'timeseries-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'timeseries-schema.json'

  /dataset/series/{datasetIDNo}/{fileId}:
    post:
      tags:
        - Timeseries
      summary: Add series
      description: Add series for timeseries
      operationId: AddTimeSeries
      parameters:
        - name: datasetIDNo
          in: path
          required: true
          description: Dataset user defined IDNo
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          description: File ID - user defined unique file identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'series-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'series-schema.json'

  # ----------------------------------------------------------------
  # Images
  # ----------------------------------------------------------------

  /datasets/create/image:
    post:
      tags:
        - Images
      summary: Create Image
      description: Create a new image using the IPTC Photo Metadata Standard 2017. See for more details http://www.iptc.org/std/photometadata/specification/IPTC-PhotoMetadata
      operationId: createImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'image-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'image-schema.json'

  # ----------------------------------------------------------------
  # Videos
  # ----------------------------------------------------------------

  /datasets/create/video:
    post:
      tags:
        - Videos
      summary: Create Video
      description: Create a new Video
      operationId: createVideo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'video-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'video-schema.json'

  # ----------------------------------------------------------------
  # Documents
  # ----------------------------------------------------------------

  /datasets/create/document/{IDNo}:
    post:
      tags:
        - Documents
      summary: Create document
      description: Create a new document
      operationId: createDocument
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Unique IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'document-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'document-schema.json'

  # ----------------------------------------------------------------
  # Tables
  # ----------------------------------------------------------------

  /datasets/create/table/{IDNo}:
    post:
      tags:
        - Tables
      summary: Create table
      description: Create a new table
      operationId: createTable
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Unique IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'table-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'table-schema.json'

  # ----------------------------------------------------------------
  # Visualizations
  # ----------------------------------------------------------------

  /datasets/create/visualization/{IDNo}:
    post:
      tags:
        - Visualizations
      summary: Create visualization
      description: Create a new visualization
      operationId: createVisualization
      parameters:
        - name: IDNo
          in: path
          required: true
          description: Unique IDNo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'visualization-schema.json'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: 'visualization-schema.json'

  # ----------------------------------------------------------------
