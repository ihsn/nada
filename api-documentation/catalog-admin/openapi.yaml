  /analytics/aggregate/daily:
    post:
      tags:
        - Analytics
      summary: Run daily aggregation (chunked)
      description: >-
        Aggregate raw events into daily tables for one calendar day. If `date` is omitted, the server picks the first missing date.
        Repeat calls with returned offsets (`pageviews.offset`, `downloads.offset`) until `has_more` is false. Admin only.
      operationId: analyticsAggregateDaily
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: Date to process (`YYYY-MM-DD`). Omit to auto-select a missing date.
                offset:
                  type: integer
                  description: Legacy starting offset for both pageviews and downloads when specialized offsets omitted
                pv_offset:
                  type: integer
                  description: Starting offset for pageview aggregation chunk
                dl_offset:
                  type: integer
                  description: Starting offset for download aggregation chunk
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsAggregateDailyResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/aggregate/monthly:
    post:
      tags:
        - Analytics
      summary: Run monthly aggregation (chunked)
      description: Roll daily aggregates into monthly aggregates for one month. Admin only.
      operationId: analyticsAggregateMonthly
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                year:
                  type: integer
                  description: Year (defaults to current year)
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  description: Month (defaults to current month)
                offset:
                  type: integer
                  default: 0
                  description: Chunk offset for large datasets
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsAggregateMonthlyResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/aggregate/totals:
    post:
      tags:
        - Analytics
      summary: Update all-time (legacy) totals
      description: Refresh study-level totals. Omit `study_id` to update in chunked batches across all studies. Admin only.
      operationId: analyticsAggregateTotals
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                study_id:
                  type: string
                  description: If set, update only this study
                offset:
                  type: integer
                  default: 0
                  description: Chunk offset when updating all studies
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsAggregateTotalsResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/aggregate/run:
    post:
      tags:
        - Analytics
      summary: Run one aggregation step (polling)
      description: Processes a single step for the web-driven aggregation UI; use with `aggregate/status` polling. Admin only.
      operationId: analyticsAggregateRun
      responses:
        '200':
          description: Step completed or idle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsAggregateRunResponse'
        '400':
          description: Error or failed step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsAggregateRunResponse'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/aggregate/status:
    get:
      tags:
        - Analytics
      summary: Aggregation job status
      description: Current aggregation state for polling (progress, step, messages). Admin only.
      operationId: analyticsAggregateStatus
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsAggregateStatusResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/aggregate/stop:
    post:
      tags:
        - Analytics
      summary: Stop aggregation
      description: Request stop of the current aggregation run. Admin only.
      operationId: analyticsAggregateStop
      responses:
        '200':
          description: Stop acknowledged (check `status` and `message` in body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, error]
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/legacy/studies:
    get:
      tags:
        - Analytics
      summary: List legacy study totals
      description: >-
        Returns all-time (legacy) study totals stored with `year=0, month=0`.
        These are pre-analytics historical counts migrated from the surveys table.
        Optionally filtered by `study_id`. Admin only.
      operationId: analyticsLegacyStudiesGet
      parameters:
        - $ref: '#/components/parameters/AnalyticsStudyId'
        - $ref: '#/components/parameters/AnalyticsLimit'
        - $ref: '#/components/parameters/AnalyticsOffset'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsPaginatedListResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'
    post:
      tags:
        - Analytics
      summary: Set legacy study totals
      description: >-
        Upsert caller-provided all-time totals (`year=0, month=0`) for one or more studies.
        Accepts a JSON array. Each item's `study_id` may be an IDNO string (default) or a
        numeric database id (add `?id_format=id`). Directly writes the supplied values —
        does **not** aggregate from monthly data. Returns per-item results and errors. Admin only.
      operationId: analyticsLegacyStudiesPost
      parameters:
        - name: id_format
          in: query
          description: Set to `id` to treat `study_id` as a numeric database id instead of IDNO
          schema:
            type: string
            enum: [id]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsLegacyStudyInput'
      responses:
        '200':
          description: All or partial records updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsLegacyStudyResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

  /analytics/legacy/files:
    get:
      tags:
        - Analytics
      summary: List legacy file totals
      description: >-
        Returns all-time (legacy) file download totals stored with `year=0, month=0`.
        Optionally filtered by `study_id`. Admin only.
      operationId: analyticsLegacyFilesGet
      parameters:
        - $ref: '#/components/parameters/AnalyticsStudyId'
        - $ref: '#/components/parameters/AnalyticsLimit'
        - $ref: '#/components/parameters/AnalyticsOffset'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsPaginatedListResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'
    post:
      tags:
        - Analytics
      summary: Set legacy file totals
      description: >-
        Upsert a caller-provided all-time download total (`year=0, month=0`) for a
        specific `study_id` + `file_name` combination.
        `study_id` may be an IDNO string (default) or a numeric database id (add `?id_format=id`).
        Directly writes the supplied value — does **not** aggregate from monthly data. Admin only.
      operationId: analyticsLegacyFilesPost
      parameters:
        - name: id_format
          in: query
          description: Set to `id` to treat `study_id` as a numeric database id instead of IDNO
          schema:
            type: string
            enum: [id]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsLegacyFileInput'
      responses:
        '200':
          description: Legacy file totals updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/AnalyticsBadRequest'
        '403':
          $ref: '#/components/responses/AnalyticsForbidden'

# ----------------------------------------------------------------
# Security & Components
# ----------------------------------------------------------------

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-KEY
      in: header

  parameters:
    AnalyticsDateFrom:
      name: date_from
      in: query
      description: Filter from date (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
    AnalyticsDateTo:
      name: date_to
      in: query
      description: Filter to date (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
    AnalyticsStudyId:
      name: study_id
      in: query
      description: Filter by study ID
      schema:
        type: string
    AnalyticsLimit:
      name: limit
      in: query
      description: Page size (default 50)
      schema:
        type: integer
        default: 50
    AnalyticsOffset:
      name: offset
      in: query
      description: Pagination offset (default 0)
      schema:
        type: integer
        default: 0
    AnalyticsYear:
      name: year
      in: query
      description: Filter by year
      schema:
        type: integer
    AnalyticsMonth:
      name: month
      in: query
      description: Filter by month (1–12)
      schema:
        type: integer
        minimum: 1
        maximum: 12
    AnalyticsExportFormat:
      name: format
      in: query
      description: Export format (default `csv`)
      schema:
        type: string
        enum: [csv, json]
        default: csv

  responses:
    AnalyticsBadRequest:
      description: Bad request or server error message
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsErrorResponse'
    AnalyticsForbidden:
      description: Admin access required (`ACCESS-DENIED`)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: failed
              message:
                type: string
                example: ACCESS-DENIED

  schemas:
    FileStore:
      type: object
      properties:
        file_name:
          type: string
          description: File name
        file_ext:
          type: string
          description: File extension
        is_image:
          type: boolean
          description: Is an image file?
        changed:
          type: string
          description: Last modified time
      xml:
        name: Filestore

    CollectionList:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        repositoryid:
          type: string
        title:
          type: string
        ispublished:
          type: integer
          description: |
            Set status to draft or published

            * `0` = draft

            * `1` = published
          enum:
            - 0
            - 1
      xml:
        name: CollectionList

    Collection:
      type: object
      required:
        - repositoryid
        - title
        - short_text
        - long_text
        - ispublished
      properties:
        repositoryid:
          type: string
          title: "Collection's unique IDNo"
          description: Collection identifier containing numbers and letters only
        title:
          type: string
          description: Collection Title
        short_text:
          type: string
          description: A short description for the collection
        long_text:
          type: string
          description: Detailed collection description. This field supports basic html and image tags.
        thumbnail:
          type: string
          title: Thumbnail image
          description: Upload an image file or provide path/url
        weight:
          type: integer
          description: Provide weight to arrange display of collection
        section:
          type: integer
          description: |
            Section/Group. To see a list of sections available, see api endpoint `collections/sections`

            * `2` = Regional collection

            * `3` = Specialized collection
        ispublished:
          type: integer
          description: |
            Set status to draft or published

            * `0` = draft

            * `1` = published
      xml:
        name: Collection

    CollectionLinkStudies:
      type: array
      items:
        type: object
        required:
          - study_idno
          - mode
          - link_collections
        properties:
          study_idno:
            type: string
            title: Study IDNO
          owner_collection:
            type: string
            title: Collection's id that owns the dataset/study
            description: (optional) if a value is provided, it will replace the owner collection for the study
          link_collections:
            type: array
            description: List of collections that will display the dataset/study
            items:
              type: string
          mode:
            type: string
            title: Update or replace the linked collections
            description: |
              Select flag to update or replace existing linked collections for the study.

              * `replace` = replace linked collections for the study with the provided list

              * `update` = (Default) add/update linked collections list
            enum:
              - replace
              - update
            default: update
      xml:
        name: CollectionLinkStudies

    DatasetList:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        type:
          type: string
          enum:
            - survey
            - geospatial
            - timeseries
        idno:
          type: string
        repositoryid:
          type: string
        title:
          type: string
        geog_coverage:
          type: string
        year_start:
          type: integer
        year_end:
          type: integer
        authoring_entity:
          type: array
          items:
            type: string
        published:
          type: integer
          description: |
            Set status to draft or published

            * `0` = draft

            * `1` = published
          enum:
            - 0
            - 1
        created:
          type: string
          format: date-time
          readOnly: true
        changed:
          type: string
          format: date-time
          readOnly: true
      xml:
        name: Dataset

    ResourceFile:
      type: object
      properties:
        name:
          type: string
        base64:
          type: string
          description: Filename base64 encoded
        date:
          type: string
          description: File creation date
      xml:
        name: ResourceFile

    GeneratePDF:
      type: object
      properties:
        variable_toc:
          type: integer
          description: Include table of contents for variables? `0`=No, `1`=Yes
        variable_description:
          type: integer
          description: Generate variable descriptions? `0`=No, `1`=Yes
        include_resources:
          type: integer
          description: Include external resources? `0`=No, `1`=Yes
        language:
          type: string
          description: |
            Set the language for the PDF report e.g. `en` for English

            * `en` - English

            * `fr` - French

            * `ar` - Arabic
      xml:
        name: generatePDF

    Resource:
      type: object
      required:
        - title
        - filename
      properties:
        dctype:
          type: string
          example: doc/adm
          description: |
            Document types for external resource e.g. `doc/adm`

            * `doc/adm` - Document, Administrative [doc/adm]

            * `doc/anl` - Document, Analytical [doc/anl]

            * `doc/oth` - Document, Other [doc/oth]

            * `doc/qst` - Document, Questionnaire [doc/qst]

            * `doc/ref` - Document, Reference [doc/ref]

            * `doc/rep` - Document, Report [doc/rep]

            * `doc/tec` - Document, Technical [doc/tec]

            * `aud` - Audio [aud]

            * `dat` - Database [dat]

            * `map` - Map [map]

            * `dat/micro` - Microdata File [dat/micro]

            * `pic` - Photo [pic]

            * `prg` - Program [prg]

            * `tbl` - Table [tbl]

            * `vid` - Video [vid]

            * `web` - Web Site [web]
        dcformat:
          type: string
          example: application/zip
          description: |
            Document file format e.g. `application/zip`

            * `application/x-compressed` - Compressed, Generic

            * `application/zip` - Compressed, ZIP

            * `application/x-cspro` - Data, CSPro

            * `application/dbase` - Data, dBase

