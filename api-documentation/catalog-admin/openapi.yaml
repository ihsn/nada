  # ----------------------------------------------------------------
  # Resumable uploads
  # ----------------------------------------------------------------

  /uploads/limits:
    get:
      tags:
        - Resumable uploads
      summary: Get upload limits
      description: Returns server-side upload limits for resumable uploads.
      responses:
        '200':
          description: Upload limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_chunk_size:
                    type: integer
                    description: Maximum allowed chunk size in bytes
                  max_file_size:
                    type: integer
                    description: Maximum allowed file size in bytes

  /uploads/init:
    post:
      tags:
        - Resumable uploads
      summary: Initialize resumable upload
      description: Start a new resumable upload session and get an upload_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                total_size:
                  type: integer
                total_chunks:
                  type: integer
                chunk_size:
                  type: integer
                metadata:
                  type: object
      responses:
        '200':
          description: Upload session initialized

  /uploads/chunk/{upload_id}:
    post:
      tags:
        - Resumable uploads
      summary: Upload a file chunk
      description: Upload a chunk of a file for a resumable upload session.
      parameters:
        - name: upload_id
          in: path
          required: true
          description: Upload session ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                chunk:
                  type: string
                  format: binary
                  description: File chunk data
                chunk_number:
                  type: integer
                  description: Chunk number (starting from 0)
                chunk_size:
                  type: integer
                  description: Size of this chunk in bytes
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk uploaded

  /uploads/status/{upload_id}:
    get:
      tags:
        - Resumable uploads
      summary: Get upload status
      description: Get the status and progress of a resumable upload session.
      parameters:
        - name: upload_id
          in: path
          required: true
          description: Upload session ID
          schema:
            type: string
      responses:
        '200':
          description: Upload status

  /uploads/download/{upload_id}:
    get:
