      required:
        - pid
        - title
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        pid:
          type: integer
          format: int64
          description: Project ID
        citation_type:
          type: string
          enum: [book, journal, article, website, other]
        title:
          type: string
        subtitle:
          type: string
        authors:
          type: array
          items:
            type: object
            properties:
              fname:
                type: string
              lname:
                type: string
        volume:
          type: string
        issue:
          type: string
        idnumber:
          type: string
        edition:
          type: string
        pub_place:
          type: string
        publisher:
          type: string
        pub_medium:
          type: string
        url:
          type: string
        page_from:
          type: integer
        page_to:
          type: integer
        pub_date:
          type: string
          example: "Full or partial date e.g. Month/Year or Year"
        abstract:
          type: string
        keywords:
          type: string
        doi:
          type: string
        country:
          type: string
        created:
          type: string
          format: date-time
        changed:
          type: string
          format: date-time

    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
