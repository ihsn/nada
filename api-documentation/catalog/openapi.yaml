openapi: "3.0.3"
info:
  description: >-
    The NADA REST API allows searching, browsing and viewing the catalog. Use the
    metadata endpoints to extract detailed study metadata as JSON.


    Find out more about NADA at [http://nada.ihsn.org](http://nada.ihsn.org).
  version: "5.5"
  title: NADA Catalog API
  x-logo:
    url: ""
    backgroundColor: "#FFFFFF"
    altText: ""

servers:
  - url: /index.php/api
    description: Local NADA instance

tags:
  - name: Collections
    description: Collections
  - name: Catalog
    description: API to browse, search and explore studies in the catalog
  - name: Metadata
    description: Access metadata and documentation available for the studies in the catalog

x-tagGroups:
  - name: Collections
    tags:
      - Collections
  - name: Catalog
    tags:
      - Catalog
  - name: Metadata
    tags:
      - Metadata

paths:

  /catalog/collections:
    get:
      tags:
        - Collections
      summary: List all collections
      description: Returns a list of all collections
      operationId: listCollections
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /catalog/collections/{repoId}:
    get:
      tags:
        - Collections
      summary: Get a collection
      description: Get info for a single collection
      operationId: SingleCollection
      parameters:
        - name: repoId
          in: path
          description: Collection ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /catalog/search:
    get:
      tags:
        - Catalog
      summary: Search catalog
      description: >-
        Search and filter published studies in the catalog. Returns paginated results with
        study-level metadata. For indicator/timeseries datasets, results include additional
        fields (`ts_dimensions`, `ts_frequency`, `ts_data_count`) describing the DSD structure.


        Pass `include_facets=1` (or `catalog_browse=1`) to receive facet counts alongside results.
      operationId: CatalogSearch
      parameters:
        - name: sk
          in: query
          description: Keywords for full-text search across study-level metadata
          schema:
            type: string
        - name: type
          in: query
          description: >-
            Filter by dataset type. Common values: `survey`, `geospatial`, `document`,
            `table`, `timeseries`, `script`, `image`, `video`, `visualization`.
            Separate multiple values with a comma.
          schema:
            type: string
        - name: from
          in: query
          description: Starting year for the data collection period (inclusive)
          schema:
            type: integer
        - name: to
          in: query
          description: End year for the data collection period (inclusive)
          schema:
            type: integer
        - name: country
          in: query
          description: >-
            Filter by country name or ISO 3 code. See `/api/catalog/country_codes` for
            valid values. Separate multiple values with a pipe: `Afghanistan|Indonesia`
            or `afg|ind`.
          schema:
            type: string
        - name: country_iso3
          in: query
          description: >-
            Filter by one or more ISO 3 country codes. Separate multiple codes with a
            pipe: `afg|ind`.
          schema:
            type: string
        - name: inc_iso
          in: query
          description: Set to `1` to include ISO3 country codes (`iso3` field) on each result row.
          schema:
            type: integer
            enum: [0, 1]
        - name: inc_countries
          in: query
          description: Set to `1` to include a `countries` array of country names on each result row.
          schema:
            type: integer
            enum: [0, 1]
        - name: collection
          in: query
          description: >-
            Filter by collection repository ID. Separate multiple values with a comma:
            `col1,col2`. Also accepts repeated parameters: `collection[]=col1&collection[]=col2`.
          schema:
            type: string
        - name: topic
          in: query
          description: Filter by topic ID or name. Separate multiple values with a pipe.
          schema:
            type: string
        - name: tag
          in: query
          description: Filter by tag. Separate multiple values with a pipe.
          schema:
            type: string
        - name: region
          in: query
          description: Filter by region ID(s). Separate multiple IDs with a comma or pipe.
          schema:
            type: string
        - name: data_class
          in: query
          description: Filter by data classification ID(s). Separate multiple IDs with a comma or pipe.
          schema:
            type: string
        - name: dtype
          in: query
          description: Filter by data access type. Separate multiple values with a comma.
          schema:
            type: string
            enum:
              - open
              - direct
              - public
              - licensed
              - enclave
              - remote
              - other
        - name: sid
          in: query
          description: Filter by internal study ID (numeric). Returns the single matching study.
          schema:
            type: integer
        - name: repo
          in: query
          description: Filter by repository ID (same as `collection` but for single-value tab filtering).
          schema:
            type: string
        - name: varcount
          in: query
          description: >-
            Filter by number of variables. Supports comparison operators:
            `>100`, `<50`, `=200`, or a plain integer for exact match.
          schema:
            type: string
        - name: created
          in: query
          description: >-
            Filter by creation date. Use format `YYYY/MM/DD` for on-or-after, or
            `YYYY/MM/DD-YYYY/MM/DD` for a date range. Example: `2023/01/01-2023/12/31`.
          schema:
            type: string
        - name: include_resources
          in: query
          description: Set to `true` to include a `resources` array of external resource links on each result row.
          schema:
            type: string
            enum: ["true", "false"]
        - name: include_facets
          in: query
          description: Set to `1` to include facet counts (dataset types, countries, topics, etc.) alongside the results.
          schema:
            type: integer
            enum: [0, 1]
        - name: ps
          in: query
          description: Number of results per page. Default is 15.
          schema:
            type: integer
        - name: page
          in: query
          description: Page number to return (1-based). Default is 1.
          schema:
            type: integer
        - name: sort_by
          in: query
          description: >-
            Field to sort results by. `rank`/`relevance` sorts by full-text relevance score
            (only meaningful when `sk` is provided). `popularity` sorts by total views.
          schema:
            type: string
            enum:
              - rank
              - relevance
              - title
              - nation
              - country
              - year
              - created
              - changed
              - popularity
              - total_views
        - name: sort_order
          in: query
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
        - name: format
          in: query
          description: Response format. Default is `json`.
          schema:
            type: string
            enum: [json, xml]
      responses:
        "200":
          description: Successful search response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties:
                      found:
                        type: string
                        description: Number of studies matching the current filters
                        example: "196"
                      total:
                        type: string
                        description: Total published studies in the catalog (unfiltered)
                        example: "1380"
                      limit:
                        type: string
                        description: Page size used for this response
                        example: "15"
                      offset:
                        type: integer
                        description: Zero-based offset of the first result
                        example: 0
                      page:
                        type: integer
                        description: Current page number
                        example: 1
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/CatalogSearchRow"
                      search_counts_by_type:
                        type: object
                        description: >-
                          Count of matching studies broken down by dataset type.
                          Keys are dataset type names; values are counts as strings.
                        additionalProperties:
                          type: string
                        example:
                          survey: "185"
                          document: "913"
                          timeseries: "196"
                          geospatial: "28"
                          table: "9"
                          script: "23"
                          image: "11"
                          video: "6"
                          timeseriesdb: "9"
                  params:
                    type: object
                    description: Echo of the search parameters used
              examples:
                timeseries_search:
                  summary: Timeseries dataset search (type=timeseries, ps=2)
                  value:
                    status: "success"
                    result:
                      found: "196"
                      total: "1380"
                      limit: "2"
                      offset: 0
                      page: 1
                      rows:
                        - id: "437"
                          type: "timeseries"
                          idno: "UIS_ADMI.GRADE2OR3PRIM.MAT"
                          doi: null
                          title: "Administration of a nationally representative learning assessment in Grade 2 or 3 in mathematics (number)"
                          subtitle: null
                          nation: ""
                          authoring_entity: ""
                          form_model: "research_license"
                          data_class_id: "2"
                          year_start: "2014"
                          year_end: "2023"
                          thumbnail: "thumbnail-s437.jpg"
                          repositoryid: "central"
                          link_da: ""
                          repo_title: null
                          created: "2024-10-29T14:15:43+00:00"
                          changed: "2026-04-27T19:25:35+00:00"
                          total_views: "3"
                          total_downloads: "0"
                          varcount: null
                          abstract: null
                          ts_dimensions: "MEASURE,REF_AREA"
                          ts_frequency: null
                          ts_data_count: "1334"
                          ts_db_study_id: null
                          ts_db_title: null
                          url: "http://nada.example.org/catalog/437"
                        - id: "512"
                          type: "timeseries"
                          idno: "WDI_SP.POP.TOTL"
                          doi: null
                          title: "Population, total"
                          subtitle: null
                          nation: "World"
                          authoring_entity: "World Bank"
                          form_model: "public"
                          data_class_id: "2"
                          year_start: "1960"
                          year_end: "2023"
                          thumbnail: "thumbnail-s512.jpg"
                          repositoryid: "central"
                          link_da: ""
                          repo_title: "Central Data Catalog"
                          created: "2023-05-12T09:00:00+00:00"
                          changed: "2024-11-01T14:30:00+00:00"
                          total_views: "841"
                          total_downloads: "54"
                          varcount: null
                          abstract: "Total population is based on the de facto definition of population."
                          ts_dimensions: "COUNTRY,FREQ,INDICATOR"
                          ts_frequency: "Annual"
                          ts_data_count: "13456"
                          ts_db_study_id: 98
                          ts_db_title: "World Development Indicators"
                          url: "http://nada.example.org/catalog/512"
                      search_counts_by_type:
                        survey: "185"
                        document: "913"
                        timeseries: "196"
                        geospatial: "28"
                        table: "9"
                        script: "23"
                        image: "11"
                        video: "6"
                        timeseriesdb: "9"
                    params:
                      collections: []
                      study_keywords: ""
                      countries: false
                      topics: ""
                      regions: []
                      data_class: []
                      from: ""
                      to: ""
                      tags: ""
                      sort_by: "title"
                      sort_order: "asc"
                      repo: ""
                      dtype: false
                      sid: ""
                      type: "timeseries"
                      country_iso3: ""
                      ps: "2"
                      created: ""
        "400":
          description: Bad input

  /catalog/stats:
    get:
      tags:
        - Catalog
      summary: Catalog headline statistics
      description: >-
        Returns counts of published studies, variables, citations, countries with data,
        and the year range covered by published studies. Results are cached for 10 minutes.
      operationId: catalogStats
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /catalog/country_codes:
    get:
      tags:
        - Catalog
      summary: List country codes
      description: List of country codes
      operationId: listCountryCodes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryCode"

  /catalog/latest:
    get:
      tags:
        - Catalog
      summary: Latest catalog entries
      description: Latest studies added to the catalog
      operationId: latestStudies
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"

  /catalog/data_access_codes:
    get:
      tags:
        - Catalog
      summary: List data access types
      description: Data access types list
      operationId: listDataAccessTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAccessCode"

  /catalog/{IDNo}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get study information
      description: >-
        Get study level metadata for a dataset. The study data files and variables metadata
        can be accessed via the following endpoints.


        * [Data files](#operation/listDataFiles) - Metadata for data files

        * [Variables](#operation/listDataFileVariables) - Metadata for variables
      operationId: singleDataset
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          required: true
          schema:
            type: string
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "../catalog-admin/survey-schema.json"

  /catalog/{IDNo}/data_files:
    get:
      tags:
        - Catalog
        - Metadata
      summary: List data files
      description: List all data files for a study
      operationId: listDataFiles
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          required: true
          schema:
            type: string
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"

  /catalog/{IDNo}/data_files/{fileId}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get single data file info
      description: Get metadata for a single data file
      operationId: singleDataFile
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          description: File ID number
          required: true
          schema:
            type: string
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "../catalog-admin/datafile-schema.json"

  /catalog/{IDNo}/data_files/{fileId}/variables:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get variables by data file
      description: >-
        Get variables attached to a single data file.
        To find all variables for a study, use [Variables by study](#operation/listVariables).
      operationId: listDataFileVariables
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          description: File ID number
          required: true
          schema:
            type: string
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"

  /catalog/variables:
    get:
      tags:
        - Catalog
      summary: Search variables across catalog
      description: >-
        Search variables across all published studies in the catalog.


        `idno` and `var_id` may be supplied as query parameters instead of URL path segments:

        * `/api/catalog/variables?sk=income` — catalog-wide keyword search

        * `/api/catalog/variables?idno=SUR_2020_HH&sk=income` — per-study keyword search

        * `/api/catalog/variables?idno=SUR_2020_HH&var_id=V1` — single variable lookup
      operationId: searchVariables
      parameters:
        - name: sk
          in: query
          description: Keyword search across variable names, labels and questions
          schema:
            type: string
        - name: idno
          in: query
          description: Study unique ID — when provided, limits the search to that study
          schema:
            type: string
        - name: var_id
          in: query
          description: Variable ID — returns a single variable when combined with `idno`
          schema:
            type: string
        - name: country
          in: query
          description: "Filter by country name or ISO3 code. Separate multiple values with pipe (|). Example: `Afghanistan|Indonesia` or `afg|idn`"
          schema:
            type: string
        - name: from
          in: query
          description: Filter by data collection start year
          schema:
            type: integer
        - name: to
          in: query
          description: Filter by data collection end year
          schema:
            type: integer
        - name: dtype
          in: query
          description: Filter by data access type
          schema:
            type: string
            enum:
              - open
              - direct
              - public
              - licensed
              - enclave
              - remote
              - other
        - name: type
          in: query
          description: Filter by dataset type (e.g. `survey`, `geospatial`)
          schema:
            type: string
        - name: sort_by
          in: query
          description: "Sort results. Valid options: `name`, `labl`, `title`, `nation`"
          schema:
            type: string
            enum: [name, labl, title, nation]
        - name: sort_order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: ps
          in: query
          description: Number of results per page. Default is 15
          schema:
            type: integer
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      found:
                        type: integer
                        description: Number of variables matching the search
                      total:
                        type: integer
                        description: Total published variables in the catalog
                      limit:
                        type: integer
                      offset:
                        type: integer
                      page:
                        type: integer
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            uid:
                              type: integer
                            vid:
                              type: string
                            fid:
                              type: string
                            name:
                              type: string
                            labl:
                              type: string
                            qstn:
                              type: string
                            sid:
                              type: integer
                            study:
                              type: object
                              properties:
                                id:
                                  type: integer
                                idno:
                                  type: string
                                title:
                                  type: string
                                nation:
                                  type: string
                  params:
                    type: object
        "400":
          description: Bad input

  /catalog/{IDNo}/variables:
    get:
      tags:
        - Catalog
        - Metadata
      summary: List or search variables by study
      description: >-
        List all variables for a study, or search within them using `?sk=`.
        To find variables by data file, use [Variables by data file](#operation/listDataFileVariables).
        For catalog-wide variable search (without an IDNo), use [Search variables](#operation/searchVariables).
      operationId: listVariables
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          required: true
          schema:
            type: string
        - name: sk
          in: query
          description: Keyword search within the study's variables (name, label, question text)
          schema:
            type: string
        - name: sort_by
          in: query
          description: "Sort results when `sk` is provided. Valid options: `name`, `labl`"
          schema:
            type: string
            enum: [name, labl]
        - name: sort_order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: ps
          in: query
          description: Number of results per page when `sk` is provided. Default is 15
          schema:
            type: integer
        - name: page
          in: query
          description: Page number when `sk` is provided
          schema:
            type: integer
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          schema:
            type: string
      responses:
        "200":
          description: >-
            Without `sk`: `{ found, total, variables[] }`.
            With `sk`: `{ found, total, limit, offset, page, variables[] }`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: integer
                    description: Variables matching the keyword (equals total when no sk)
                  total:
                    type: integer
                    description: Total variables in the study
                  limit:
                    type: integer
                  offset:
                    type: integer
                  page:
                    type: integer
                  variables:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: integer
                        vid:
                          type: string
                        fid:
                          type: string
                        name:
                          type: string
                        labl:
                          type: string
                        qstn:
                          type: string

  /catalog/{IDNo}/variables/{varId}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get a single variable
      description: >-
        Get full metadata for a single variable.
        Alternatively, supply both `idno` and `var_id` as query parameters to
        `/api/catalog/variables?idno={IDNo}&var_id={varId}`.
      operationId: findSingleVariable
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          required: true
          schema:
            type: string
        - name: varId
          in: path
          description: Variable ID
          required: true
          schema:
            type: string
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "../catalog-admin/variable-schema.json"

  /catalog/ddi/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Download DDI/XML
      description: Download DDI 2.5 CodeBook XML (available for microdata studies only)
      operationId: downloadDDI
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          required: true
          schema:
            type: string
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/xml:
              schema:
                type: string

  /catalog/json/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Download JSON
      description: Download study metadata as JSON
      operationId: downloadJSON
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          required: true
          schema:
            type: string
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object

components:
  schemas:

    CatalogSearchRow:
      type: object
      description: >-
        A single study returned by the catalog search endpoint. All fields are present
        for every dataset type; indicator/timeseries-specific fields (`ts_dimensions`,
        `ts_frequency`, `ts_data_count`, `ts_db_study_id`, `ts_db_title`) are `null`
        for non-timeseries types.
      properties:
        id:
          type: integer
          description: Internal numeric study ID
          example: 47
        idno:
          type: string
          description: Study unique identifier (IDNO)
          example: "WDI_2024"
        type:
          type: string
          description: Dataset type
          example: "timeseries"
        doi:
          type: string
          nullable: true
          description: Digital Object Identifier, if assigned
          example: null
        title:
          type: string
          description: Study title
          example: "World Development Indicators 2024"
        subtitle:
          type: string
          nullable: true
          description: Study subtitle
          example: null
        nation:
          type: string
          description: Primary country or region name
          example: "World"
        authoring_entity:
          type: string
          description: Organisation(s) responsible for producing the dataset
          example: "World Bank"
        abstract:
          type: string
          nullable: true
          description: Study abstract or description
          example: "Annual time series on development indicators for 217 economies."
        year_start:
          type: integer
          nullable: true
          description: Start year of the data collection period
          example: 1960
        year_end:
          type: integer
          nullable: true
          description: End year of the data collection period
          example: 2023
        repositoryid:
          type: string
          description: Repository (collection) ID the study belongs to
          example: "central"
        repo_title:
          type: string
          description: Human-readable title of the repository
          example: "Central Data Catalog"
        thumbnail:
          type: string
          nullable: true
          description: Relative path to the study thumbnail image
          example: "/files/thumbnails/wdi_2024.png"
        link_da:
          type: string
          nullable: true
          description: External data access URL, if applicable
          example: null
        created:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the record was created
          example: "2024-01-15T08:30:00Z"
        changed:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the record was last modified
          example: "2024-06-01T12:00:00Z"
        total_views:
          type: integer
          description: Cumulative page view count
          example: 4821
        total_downloads:
          type: integer
          description: Cumulative file download count
          example: 312
        varcount:
          type: integer
          nullable: true
          description: Number of variables associated with the study
          example: 1400
        data_class_id:
          type: integer
          nullable: true
          description: Internal ID of the data classification assigned to this study
          example: 2
        form_model:
          type: string
          nullable: true
          description: Metadata schema / form model used (e.g. `survey`, `timeseries`)
          example: "timeseries"
        url:
          type: string
          description: Absolute URL to the study detail page
          example: "http://catalog.example.org/catalog/47"
        ts_dimensions:
          type: string
          nullable: true
          description: >-
            **Timeseries/indicator datasets only.** Comma-separated list of DSD dimension
            component names (sorted alphabetically) derived from the linked Data Structure
            Definition. These are the axes along which indicator values are disaggregated
            (e.g. country, year, sex). `null` for non-timeseries types or when no DSD is linked.
          example: "country,freq,indicator,sex,year"
        ts_frequency:
          type: string
          nullable: true
          description: >-
            **Timeseries/indicator datasets only.** Comma-separated list of periodicity
            codelist titles from the DSD's periodicity component (e.g. `Annual`, `Quarterly`).
            `null` when not applicable or no codelist is defined.
          example: "Annual"
        ts_data_count:
          type: integer
          nullable: true
          description: >-
            **Timeseries/indicator datasets only.** Total number of data observation
            rows stored for this dataset. `null` for non-timeseries types.
          example: 98420
        ts_db_study_id:
          type: integer
          nullable: true
          description: >-
            **Timeseries/indicator datasets only.** Internal ID of the linked timeseries
            database (parent study), if this study belongs to one. `null` otherwise.
          example: 12
        ts_db_title:
          type: string
          nullable: true
          description: >-
            **Timeseries/indicator datasets only.** Title of the linked timeseries
            database (parent study). `null` otherwise.
          example: "World Bank Open Data"
        iso3:
          type: string
          description: >-
            Comma-separated ISO 3 country codes for countries associated with this study.
            Only present when `inc_iso=1` is passed in the request.
          example: "AFG,IND,KEN"
        countries:
          type: array
          description: >-
            Array of country name objects for countries associated with this study.
            Only present when `inc_countries=1` is passed in the request.
          items:
            type: object
            properties:
              name:
                type: string
                example: "Afghanistan"
        resources:
          type: array
          description: >-
            External resource links attached to this study. Only present when
            `include_resources=true` is passed in the request.
          items:
            type: object
            properties:
              resource_id:
                type: integer
                example: 101
              link:
                type: string
                example: "https://databank.worldbank.org/source/world-development-indicators"
              ext:
                type: string
                example: "url"
              title:
                type: string
                example: "WDI Online Data Portal"
      example:
        id: 47
        idno: "WDI_2024"
        type: "timeseries"
        doi: null
        title: "World Development Indicators 2024"
        subtitle: null
        nation: "World"
        authoring_entity: "World Bank"
        abstract: "Annual time series on development indicators for 217 economies, covering health, education, economy, environment and more."
        year_start: 1960
        year_end: 2023
        repositoryid: "central"
        repo_title: "Central Data Catalog"
        thumbnail: "/files/thumbnails/wdi_2024.png"
        link_da: null
        created: "2024-01-15T08:30:00Z"
        changed: "2024-06-01T12:00:00Z"
        total_views: 4821
        total_downloads: 312
        varcount: 1400
        data_class_id: 2
        form_model: "timeseries"
        url: "http://catalog.example.org/catalog/47"
        ts_dimensions: "country,freq,indicator,sex,year"
        ts_frequency: "Annual"
        ts_data_count: 98420
        ts_db_study_id: 12
        ts_db_title: "World Bank Open Data"

    Catalog:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        idno:
          type: string
        title:
          type: string
        nation:
          type: string
        created:
          type: string
          format: date-time
        changed:
          type: string
          format: date-time

    Collection:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        repositoryID:
          type: string
          description: Collection unique ID
        title:
          type: string
          description: Collection title
        short_text:
          type: string
          description: Short description
        long_text:
          type: string
          description: Detailed description for the collection in HTML format
        thumbnail:
          type: string
          description: Collection thumbnail

    CountryCode:
      type: object
      properties:
        countryid:
          type: integer
          format: int64
        name:
          type: string
          description: Country name
        iso:
          type: string
          description: Country ISO 3 code

    DataAccessCode:
      type: object
      properties:
        type:
          type: string
          description: Data access type
        title:
          type: string
          description: Title

    AuthenticationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        user_id:
          type: integer
        username:
          type: string
        api-keys:
          type: object

    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        project_type:
          type: string
          enum: [survey, geospatial]
        title:
          type: string
        description:
          type: string
        shortname:
          type: string
        collaborators:
          type: array
          items:
            type: string
            format: email
          example:
            - user@example.com
            - user2@example.com
        status:
          type: string
          readOnly: true
          description: >-
            Project status codes

            * `draft` - Draft mode

            * `submitted` - Project is submitted and locked for user to make any further changes

            * `processed` - Project accepted and is being processed

            * `closed` - Processing completed and project is completed

            * `published` - Project published to one or more catalogs

            * `cancelled` - Project was cancelled
          enum: [draft, submitted, processed, closed, cancelled, published]
        created:
          type: string
          format: date-time
          readOnly: true
        changed:
          type: string
          format: date-time
          readOnly: true

    ProjectAccessPolicy:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        access_policy:
          type: string
          description: >-
            Select the access policy suitable for your data.

            * `direct` - Direct access

            * `public` - Public access

            * `licensed` - Licensed access, require users to register and submit request for access

            * `enclave` - Data Enclave

            * `remote` - Data available from remote repository

            * `other` - Other
          enum: [open, direct, public, licensed, enclave, remote, other]
        to_catalog:
          type: string
          description: >-
            Select catalog for publishing the data

            * `internal` - Internal catalog

            * `external` - External public catalog
          enum: [internal, external]
        is_embargoed:
          type: boolean
          description: Is the data embargoed?
        embargoed_notes:
          type: string
          description: Indicate the terms of the embargo e.g. time period and any other special instructions.
        disclosure_risk:
          type: string
          description: List any identifying or sensitive variables so that access to these can be suppressed.
        library_notes:
          type: string
          description: Notes for the deposit reviewers
        cc:
          type: string
          description: Email addresses (semicolon-separated) to receive a copy of the submission.
        created:
          type: string
          format: date-time
          readOnly: true
        changed:
          type: string
          format: date-time
          readOnly: true

    Resource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        pid:
          type: integer
          format: int64
          description: Project ID
        resource_type:
          type: string
          enum: [microdata, questionnaire, report, table, other]
        title:
          type: string
        description:
          type: string
        filename:
          type: string
        created:
          type: string
          format: date-time
        changed:
          type: string
          format: date-time

    Citation:
