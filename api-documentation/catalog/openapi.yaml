openapi: "3.0.3"
info:
  description: >-
    The NADA REST API allows searching, browsing and viewing the catalog. Use the
    metadata endpoints to extract detailed study metadata as JSON.


    Find out more about NADA at [http://nada.ihsn.org](http://nada.ihsn.org).


    ## Study identifiers


    Endpoints that take `{IDNo}` accept the study's unique IDNo. Add `id_format=id` to pass the numeric
    study ID (the `id` field of search results) instead; a value that is not a positive whole number then
    fails with `INVALID_ID_FORMAT_ID`. An IDNo that does not exist fails with `IDNO-NOT-FOUND`.


    ## Access


    No API key is needed: this API is public and reads published studies. Unpublished studies are returned
    only to a user signed in to the site (browser session) with permission to view them; everyone else gets
    the same error as for a study that does not exist. An `X-API-KEY` header is not read by this API.


    ## Errors


    Errors are returned with HTTP status **400**, including "not found" errors (there are no 404 responses).
    The body always has `status: failed`. The error text is in `message` for study, data file, variable and
    PDF documentation endpoints, and in `errors` for the others; each endpoint's 400 response says which.
    `GET /catalog/collections` is an exception: its error body is the error text as a plain JSON string.


    Paging errors from search endpoints also carry `error_code` (`page_out_of_range` or `cursor_invalid`)
    and a `message`.


    Error texts are short codes (e.g. `IDNO-NOT-FOUND`, `REPOSITORY-NOT-FOUND`) or a sentence. Clients should
    rely on the HTTP status, `status` and `error_code`, not on the exact text.


    ## Response format


    Responses are JSON unless stated otherwise. Fields not described here may be present; they are not part
    of the documented API and may change.


    **Numbers.** Fields documented as integers are read from the database. With MySQL they are returned as
    JSON strings (`"841"`); with SQL Server they are JSON numbers. Clients should accept both for any
    integer field, except the values of `/catalog/stats`, which are always JSON numbers.


    **Dates.** `created` and `changed` are ISO 8601 date-times (e.g. `2026-11-27T14:05:00-05:00`, in the
    server's time zone), except in `/catalog/latest`, which uses `Nov-27-2026`.
  version: "5.9"
  title: NADA Catalog API
  x-logo:
    url: ""
    backgroundColor: "#FFFFFF"
    altText: ""

servers:
  - url: /index.php/api
    description: Local NADA instance

tags:
  - name: Collections
    description: Collections
  - name: Catalog
    description: API to browse, search and explore studies in the catalog
  - name: Metadata
    description: Access metadata and documentation available for the studies in the catalog

x-tagGroups:
  - name: Collections
    tags:
      - Collections
  - name: Catalog
    tags:
      - Catalog
  - name: Metadata
    tags:
      - Metadata

paths:

  /catalog/collections:
    get:
      tags:
        - Collections
      summary: List all collections
      description: Returns all published collections.
      operationId: listCollections
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  total:
                    type: integer
                    description: Number of collections
                  collections:
                    type: array
                    items:
                      $ref: "#/components/schemas/Collection"
        "400":
          description: Error. The body is the error text as a JSON string (not an object).
          content:
            application/json:
              schema:
                type: string

  /catalog/collections/{repoId}:
    get:
      tags:
        - Collections
      summary: Get a collection
      description: >-
        Get a single collection by its `repositoryid`. The collection object is returned directly,
        without a `status` wrapper.
      operationId: SingleCollection
      parameters:
        - name: repoId
          in: path
          description: Collection ID (`repositoryid`)
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          description: "`REPOSITORY-NOT-FOUND`, or `MISSING_PARAM: repositoryId`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/datasets/{repoId}:
    get:
      tags:
        - Collections
      summary: List studies in a collection
      description: >-
        All published studies in a collection, without paging. To search or page within a collection, use
        [Search catalog](#operation/CatalogSearch) with `collection`. The default collection `central` is
        not a collection here and gives `REPOSITORY-NOT-FOUND`; use [List all study IDNos](#operation/listStudyIdnos)
        for the whole catalog.
      operationId: listCollectionStudies
      parameters:
        - name: repoId
          in: path
          description: Collection ID (`repositoryid`)
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  total:
                    type: integer
                  datasets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Numeric study ID
                        idno:
                          type: string
                        repositoryid:
                          type: string
                          description: The collection ID that was asked for
                        title:
                          type: string
                        nation:
                          type: string
                        year_start:
                          type: integer
        "400":
          description: "`REPOSITORY-NOT-FOUND`, or `MISSING_PARAM: repositoryId`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/search:
    get:
      tags:
        - Catalog
      summary: Search catalog
      description: >-
        Search and filter published studies in the catalog. Returns paginated results with
        study-level metadata. For indicator/timeseries datasets, results include additional
        fields (`ts_dimensions`, `ts_frequency`, `ts_data_count`) describing the DSD structure.


        Pass `include_facets=1` (or `catalog_browse=1`) to receive facet counts alongside results.
      operationId: CatalogSearch
      parameters:
        - name: sk
          in: query
          description: Keywords for full-text search across study-level metadata
          schema:
            type: string
        - name: type
          in: query
          description: >-
            Filter by dataset type. Common values: `survey`, `geospatial`, `document`,
            `table`, `timeseries`, `script`, `image`, `video`.
            Separate multiple values with a comma.
          schema:
            type: string
        - name: from
          in: query
          description: Starting year for the data collection period (inclusive)
          schema:
            type: integer
        - name: to
          in: query
          description: End year for the data collection period (inclusive)
          schema:
            type: integer
        - name: country
          in: query
          description: >-
            Filter by country name or ISO 3 code. See `/api/catalog/country_codes` for
            valid values. Separate multiple values with a pipe: `Afghanistan|Indonesia`
            or `afg|ind`.
          schema:
            type: string
        - name: country_iso3
          in: query
          description: >-
            Filter by one or more ISO 3 country codes. Separate multiple codes with a
            pipe: `afg|ind`.
          schema:
            type: string
        - name: inc_iso
          in: query
          description: Set to `1` to include ISO3 country codes (`iso3` field) on each result row.
          schema:
            type: integer
            enum: [0, 1]
        - name: inc_countries
          in: query
          description: Set to `1` to include a `countries` array of country names on each result row.
          schema:
            type: integer
            enum: [0, 1]
        - name: collection
          in: query
          description: >-
            Filter by collection repository ID. Separate multiple values with a comma:
            `col1,col2`. Also accepts repeated parameters: `collection[]=col1&collection[]=col2`.
          schema:
            type: string
        - name: topic
          in: query
          description: Filter by topic ID or name. Separate multiple values with a pipe.
          schema:
            type: string
        - name: tag
          in: query
          description: Filter by tag. Separate multiple values with a pipe.
          schema:
            type: string
        - name: region
          in: query
          description: Filter by region ID(s). Separate multiple IDs with a comma or pipe.
          schema:
            type: string
        - name: data_class
          in: query
          description: Filter by data classification ID(s). Separate multiple IDs with a comma or pipe.
          schema:
            type: string
        - name: dtype
          in: query
          description: Filter by data access type. Separate multiple values with a comma.
          schema:
            type: string
            enum:
              - open
              - direct
              - public
              - licensed
              - enclave
              - remote
              - other
        - name: sid
          in: query
          description: Filter by internal study ID (numeric). Returns the single matching study.
          schema:
            type: integer
        - name: repo
          in: query
          description: Filter by repository ID (same as `collection` but for single-value tab filtering).
          schema:
            type: string
        - name: varcount
          in: query
          description: >-
            Filter by number of variables. Supports comparison operators:
            `>100`, `<50`, `=200`, or a plain integer for exact match.
          schema:
            type: string
        - name: created
          in: query
          description: >-
            Filter by creation date. Use format `YYYY/MM/DD` for on-or-after, or
            `YYYY/MM/DD-YYYY/MM/DD` for a date range. Example: `2023/01/01-2023/12/31`.
          schema:
            type: string
        - name: include_resources
          in: query
          description: Set to `true` to include a `resources` array of external resource links on each result row.
          schema:
            type: string
            enum: ["true", "false"]
        - name: include_facets
          in: query
          description: Set to `1` to include facet counts (dataset types, countries, topics, etc.) alongside the results.
          schema:
            type: integer
            enum: [0, 1]
        - name: ps
          in: query
          description: Number of results per page, 1 to 100 (larger values give 100). Default is 15.
          schema:
            type: integer
        - name: page
          in: query
          description: Page number to return (1-based), for the first `max_offset` results. Default is 1.
          schema:
            type: integer
        - name: cursor
          in: query
          description: >-
            Browse only (no `sk`): the `next_cursor` or `prev_cursor` of the previous page of the same browse, in place
            of `page`, to page past `max_offset` studies. Keyword searches page by `page` only.
          schema:
            type: string
        - name: sort_by
          in: query
          description: >-
            Field to sort results by. `rank`/`relevance` sorts by full-text relevance score
            (only meaningful when `sk` is provided). `popularity` sorts by total views.
          schema:
            type: string
            enum:
              - rank
              - relevance
              - title
              - nation
              - country
              - year
              - created
              - changed
              - popularity
              - total_views
        - name: sort_order
          in: query
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
        - name: format
          in: query
          description: Response format. Default is `json`.
          schema:
            type: string
            enum: [json, xml]
      responses:
        "200":
          description: Successful search response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties:
                      found:
                        type: integer
                        description: Number of studies matching the current filters
                        example: 196
                      total:
                        type: integer
                        description: >-
                          Total published studies in the catalog (unfiltered). A JSON string on MySQL
                          (e.g. `"1380"`), like other database integers
                        example: "1380"
                      limit:
                        type: integer
                        description: Page size used for this response
                        example: 15
                      offset:
                        type: integer
                        description: Zero-based offset of the first result
                        example: 0
                      page:
                        type: integer
                        description: Current page number (worked out from `offset` on a page reached by cursor)
                      max_offset:
                        type: integer
                        nullable: true
                        description: >-
                          Results reachable by `page` (10,000); a browse continues with its cursors. Null when the
                          catalog's own database serves the search (no limit).
                      next_cursor:
                        type: string
                        nullable: true
                        description: Browse only — cursor of the next page; null on the last page and for keyword searches
                      prev_cursor:
                        type: string
                        nullable: true
                        description: Browse only — cursor of the previous page; null on the first page
                        example: 1
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/CatalogSearchRow"
                      search_counts_by_type:
                        type: object
                        description: >-
                          Count of matching studies broken down by dataset type.
                          Keys are dataset type names; values are counts as strings.
                        additionalProperties:
                          type: string
                        example:
                          survey: "185"
                          document: "913"
                          timeseries: "196"
                          geospatial: "28"
                          table: "9"
                          script: "23"
                          image: "11"
                          video: "6"
                          timeseriesdb: "9"
                  params:
                    type: object
                    description: Echo of the search parameters used
              examples:
                timeseries_search:
                  summary: Timeseries dataset search (type=timeseries, ps=2)
                  value:
                    status: "success"
                    result:
                      found: "196"
                      total: "1380"
                      limit: "2"
                      offset: 0
                      page: 1
                      rows:
                        - id: "437"
                          type: "timeseries"
                          idno: "UIS_ADMI.GRADE2OR3PRIM.MAT"
                          doi: null
                          title: "Administration of a nationally representative learning assessment in Grade 2 or 3 in mathematics (number)"
                          subtitle: null
                          nation: ""
                          authoring_entity: ""
                          form_model: "research_license"
                          data_class_id: "2"
                          year_start: "2014"
                          year_end: "2023"
                          thumbnail: "thumbnail-s437.jpg"
                          repositoryid: "central"
                          link_da: ""
                          repo_title: null
                          created: "2024-10-29T14:15:43+00:00"
                          changed: "2026-04-27T19:25:35+00:00"
                          total_views: "3"
                          total_downloads: "0"
                          varcount: null
                          abstract: null
                          ts_dimensions: "MEASURE,REF_AREA"
                          ts_frequency: null
                          ts_data_count: "1334"
                          ts_db_study_id: null
                          ts_db_title: null
                          url: "http://nada.example.org/catalog/437"
                        - id: "512"
                          type: "timeseries"
                          idno: "WDI_SP.POP.TOTL"
                          doi: null
                          title: "Population, total"
                          subtitle: null
                          nation: "World"
                          authoring_entity: "World Bank"
                          form_model: "public"
                          data_class_id: "2"
                          year_start: "1960"
                          year_end: "2023"
                          thumbnail: "thumbnail-s512.jpg"
                          repositoryid: "central"
                          link_da: ""
                          repo_title: "Central Data Catalog"
                          created: "2023-05-12T09:00:00+00:00"
                          changed: "2024-11-01T14:30:00+00:00"
                          total_views: "841"
                          total_downloads: "54"
                          varcount: null
                          abstract: "Total population is based on the de facto definition of population."
                          ts_dimensions: "COUNTRY,FREQ,INDICATOR"
                          ts_frequency: "Annual"
                          ts_data_count: "13456"
                          ts_db_study_id: 98
                          ts_db_title: "World Development Indicators"
                          url: "http://nada.example.org/catalog/512"
                      search_counts_by_type:
                        survey: "185"
                        document: "913"
                        timeseries: "196"
                        geospatial: "28"
                        table: "9"
                        script: "23"
                        image: "11"
                        video: "6"
                        timeseriesdb: "9"
                    params:
                      collections: []
                      study_keywords: ""
                      countries: false
                      topics: ""
                      regions: []
                      data_class: []
                      from: ""
                      to: ""
                      tags: ""
                      sort_by: "title"
                      sort_order: "asc"
                      repo: ""
                      dtype: false
                      sid: ""
                      type: "timeseries"
                      country_iso3: ""
                      ps: "2"
                      created: ""
        "400":
          description: >-
            Bad input. A paging error carries `error_code`: `page_out_of_range` (a page past `max_offset`; a browse
            continues with `next_cursor`) or `cursor_invalid` (the cursor is not one of this search; start again from
            the first page).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorErrors"
                  - $ref: "#/components/schemas/PagingError"

  /catalog/stats:
    get:
      tags:
        - Catalog
      summary: Catalog headline statistics
      description: >-
        Returns counts of published studies, variables, citations, countries with data,
        and the year range covered by published studies. Results are cached for 10 minutes.
      operationId: catalogStats
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  values:
                    type: object
                    properties:
                      studies:
                        type: integer
                      variables:
                        type: integer
                      citations:
                        type: integer
                      countries_with_data:
                        type: integer
                      year_range:
                        type: object
                        properties:
                          min:
                            type: integer
                          max:
                            type: integer
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/country_codes:
    get:
      tags:
        - Catalog
      summary: List country codes
      description: All countries known to the catalog, with their ISO 3 codes.
      operationId: listCountryCodes
      responses:
        "200":
          description: >-
            Successful operation. When there are no countries, `country_codes` is
            `{ "error": "NO_RECORDS_FOUND" }` instead of an array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  country_codes:
                    type: array
                    items:
                      $ref: "#/components/schemas/CountryCode"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/latest:
    get:
      tags:
        - Catalog
      summary: Latest catalog entries
      description: Most recently added published studies, newest first. This response has no `status` field.
      operationId: latestStudies
      parameters:
        - name: limit
          in: query
          description: Number of studies to return. Default 15.
          schema:
            type: integer
        - name: country
          in: query
          description: Only studies whose `nation` is exactly this value
          schema:
            type: string
      responses:
        "200":
          description: >-
            Successful operation. When no study matches, `result` is `{ "error": "NO_RECORDS_FOUND" }` and
            `found` is 1.
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                  found:
                    type: integer
                    description: Number of studies in `result`
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        idno:
                          type: string
                        title:
                          type: string
                        nation:
                          type: string
                        created:
                          type: string
                          description: Date added, as `Mon-DD-YYYY` (e.g. `Nov-27-2026`), not ISO 8601
                          example: "Nov-27-2026"
                        changed:
                          type: string
                          description: Date last changed, as `Mon-DD-YYYY`
                          example: "Nov-27-2026"
                        url:
                          type: string
                          description: Study page URL
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/data_access_codes:
    get:
      tags:
        - Catalog
      summary: List data access types
      description: Data access types. This response has no `status` field.
      operationId: listDataAccessTypes
      responses:
        "200":
          description: >-
            Successful operation. When there are no access types, `codes` is
            `{ "error": "NO_RECORDS_FOUND" }`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes:
                    type: array
                    items:
                      $ref: "#/components/schemas/DataAccessCode"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/list_idno:
    get:
      tags:
        - Catalog
      summary: List all study IDNos
      description: IDNo, numeric ID and type of every published study, without paging.
      operationId: listStudyIdnos
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdnoList"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /catalog/list_idno/{type}:
    get:
      tags:
        - Catalog
      summary: List study IDNos of one type
      description: Same as [List all study IDNos](#operation/listStudyIdnos), limited to one dataset type.
      operationId: listStudyIdnosByType
      parameters:
        - name: type
          in: path
          required: true
          description: Dataset type, e.g. `survey`, `geospatial`, `timeseries`, `document`
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdnoList"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /catalog/filters:
    get:
      tags:
        - Catalog
      summary: List search filter names
      description: >-
        Names of the filters that [Filter values](#operation/getFilterValues) accepts: the built-in filters
        and the user-defined facets.
      operationId: listFilters
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  values:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Please provide a filter name
                      filters:
                        type: array
                        description: Filter names
                        items:
                          type: string
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/filters/{filterName}:
    get:
      tags:
        - Catalog
      summary: Filter values
      description: >-
        Values of one search filter, with the number of published studies for each. Only the names returned
        by [List search filter names](#operation/listFilters) are accepted; others give `FILTER_NOT_FOUND`.
        Built-in filters return the shapes below. A user-defined facet returns `{ type, title, values[] }`, where each value
        has `id`, `title` and `found`.


        Lists keyed by ID (`country`, `collection`, `dtype`, `region`) are JSON objects, not arrays:
        `{ "4": {...}, "12": {...} }`. When a list is empty, `values` is `false`.
      operationId: getFilterValues
      parameters:
        - name: filterName
          in: path
          required: true
          description: A name from [List search filter names](#operation/listFilters), e.g. `country`, `year`, `collection`, `dtype`
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  values:
                    oneOf:
                      - type: object
                        title: country
                        description: Countries, keyed by country ID
                        additionalProperties:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            iso3:
                              type: string
                            found:
                              type: integer
                      - type: object
                        title: year
                        properties:
                          min_year:
                            type: integer
                          max_year:
                            type: integer
                      - type: object
                        title: collection
                        description: Collections, keyed by `repositoryid`
                        additionalProperties:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Collection ID (`repositoryid`)
                            pid:
                              type: integer
                            title:
                              type: string
                            repositoryid:
                              type: string
                            found:
                              type: integer
                            group_name:
                              type: string
                              nullable: true
                      - type: object
                        title: dtype
                        description: >-
                          Data access types, keyed by access type ID. `title` is a translation key such as
                          `legend_data_direct`, not a display text
                        additionalProperties:
                          type: object
                          properties:
                            id:
                              type: integer
                            code:
                              type: string
                            title:
                              type: string
                      - type: object
                        title: region
                        description: >-
                          Regions, keyed by region ID. Only when the site has a facet named `region` (not in a
                          default install)
                        additionalProperties:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            group_name:
                              type: string
                            weight:
                              type: integer
                            found:
                              type: integer
                      - type: object
                        title: user-defined facet
                        properties:
                          type:
                            type: string
                            enum: [user]
                          title:
                            type: string
                          values:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                title:
                                  type: string
                                found:
                                  type: integer
        "400":
          description: "`FILTER_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/{IDNo}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get study information
      description: >-
        Study-level information and metadata. The data files and variables can be read with:


        * [Data files](#operation/listDataFiles) - Metadata for data files

        * [Variables](#operation/listVariables) - Metadata for variables


        `metadata` is the study's metadata document, in the JSON schema of its type (`survey` for
        microdata, `geospatial`, `timeseries`, `document`, `table`, `image`, `video`, `script`, ...). For
        geospatial studies it is rebuilt from the data files and variables.
      operationId: singleDataset
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  dataset:
                    $ref: "#/components/schemas/Study"
        "400":
          description: "`IDNO-NOT-FOUND`, `INVALID_ID_FORMAT_ID`, or `DATASET_NOT_FOUND` (missing or not visible)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /catalog/thumbnail/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Get study thumbnail URL
      description: URL of the study's thumbnail image. Returns JSON with the URL, not the image itself.
      operationId: getThumbnail
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  thumbnail:
                    type: string
                    description: Absolute URL of the image, under `files/thumbnails/`
        "400":
          description: "`THUMBNAIL_NOT_FOUND` (the study has no thumbnail), or a study ID error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/pdf_documentation/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Study PDF documentation status
      description: >-
        Whether a PDF of the study documentation (generated from the DDI) exists in the site language, and
        whether it is up to date with the DDI. Returns status information only, not the PDF.
        The IDNo can also be passed as `?idno=` to `/catalog/pdf_documentation`.
      operationId: getPdfDocumentationStatus
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  pdf_documentation:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [uptodate, outdated, na]
                        description: "`na`: no PDF; `outdated`: the DDI changed after the PDF was made"
                      filename:
                        type: string
                        description: PDF file name; only present when the PDF exists
        "400":
          description: "`IDNO-NOT-PROVIDED`, or a study ID error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /catalog/{IDNo}/data_files:
    get:
      tags:
        - Catalog
        - Metadata
      summary: List data files
      description: All data files of a study.
      operationId: listDataFiles
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: >-
            Successful operation. This response has no `status` field. `datafiles` is a JSON object keyed by
            file ID (`F1`, `F2`, ...), in natural order, not an array. A study without data files returns
            `datafiles: false`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datafiles:
                    oneOf:
                      - type: object
                        additionalProperties:
                          $ref: "#/components/schemas/DataFile"
                      - type: boolean
                        enum: [false]
                        description: The study has no data files
        "400":
          description: "`STUDY_NOT_FOUND`, `DATASET_NOT_FOUND`, or a study ID error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /catalog/{IDNo}/data_files/{fileId}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get single data file info
      description: Metadata for a single data file.
      operationId: singleDataFile
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - name: fileId
          in: path
          description: File ID (`file_id`, e.g. `F1`)
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation. This response has no `status` field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datafile:
                    $ref: "#/components/schemas/DataFile"
        "400":
          description: "`ID-NOT-FOUND` (no such file), `STUDY_NOT_FOUND`, or a study ID error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /catalog/{IDNo}/data_files/{fileId}/variables:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get variables by data file
      description: >-
        All variables of one data file, without paging.
        To find all variables for a study, use [Variables by study](#operation/listVariables).
      operationId: listDataFileVariables
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - name: fileId
          in: path
          description: File ID (`file_id`, e.g. `F1`)
          required: true
          schema:
            type: string
        - name: metadata_detailed
          in: query
          description: Set to `true` to include each variable's `metadata`
          schema:
            type: string
            enum: ["true"]
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation. This response has no `status` field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Number of variables returned
                  variables:
                    type: array
                    items:
                      $ref: "#/components/schemas/VariableListItem"
        "400":
          description: "`FILE-ID-REQUIRED`, `STUDY_NOT_FOUND`, or a study ID error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /catalog/variables:
    get:
      tags:
        - Catalog
      summary: Search variables across catalog
      description: >-
        Search variables across all published studies in the catalog.


        `idno` and `var_id` may be supplied as query parameters instead of URL path segments:

        * `/api/catalog/variables?sk=income` — catalog-wide keyword search

        * `/api/catalog/variables?idno=SUR_2020_HH&sk=income` — per-study keyword search

        * `/api/catalog/variables?idno=SUR_2020_HH&var_id=V1` — single variable lookup


        **Paging.** The first `max_offset` results (1,000 by default) are paged by `page`. Past them, page with
        `cursor`: send the `next_cursor` (or `prev_cursor`) of the previous response, with the same search
        parameters, in place of `page`. A cursor is an opaque string; pass it back unchanged. A `page` past
        `max_offset` answers 400 with `error_code: page_out_of_range`; a cursor that does not belong to the search
        answers 400 with `error_code: cursor_invalid`. `max_offset` is `null` (no limit, no cursors) when the
        catalog's own database serves the search (pages of more than 100 results, or a search engine other than
        NADA-AI).
      operationId: searchVariables
      parameters:
        - name: sk
          in: query
          description: Keyword search across variable names, labels and questions
          schema:
            type: string
        - name: idno
          in: query
          description: Study unique ID — when provided, limits the search to that study
          schema:
            type: string
        - name: var_id
          in: query
          description: Variable ID — returns a single variable when combined with `idno`
          schema:
            type: string
        - name: country
          in: query
          description: "Filter by country name or ISO3 code. Separate multiple values with pipe (|). Example: `Afghanistan|Indonesia` or `afg|idn`"
          schema:
            type: string
        - name: from
          in: query
          description: Filter by data collection start year
          schema:
            type: integer
        - name: to
          in: query
          description: Filter by data collection end year
          schema:
            type: integer
        - name: dtype
          in: query
          description: Filter by data access type
          schema:
            type: string
            enum:
              - open
              - direct
              - public
              - licensed
              - enclave
              - remote
              - other
        - name: type
          in: query
          description: Filter by dataset type (e.g. `survey`, `geospatial`)
          schema:
            type: string
        - name: sort_by
          in: query
          description: "Sort results. Valid options: `name`, `labl`, `title`, `nation`"
          schema:
            type: string
            enum: [name, labl, title, nation]
        - name: sort_order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: ps
          in: query
          description: Number of results per page, 1 to 100 (larger values give 100). Default is 15
          schema:
            type: integer
        - name: page
          in: query
          description: Page number, for the first `max_offset` results
          schema:
            type: integer
        - name: cursor
          in: query
          description: >-
            `next_cursor` or `prev_cursor` of the previous page of this search, in place of `page`, to page past
            `max_offset` results
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      found:
                        type: integer
                        description: Number of variables matching the search
                      found_is_lower_bound:
                        type: boolean
                        description: >-
                          True when only the first matches were counted (a very broad keyword search): `found` is a
                          lower bound ("20,000+")
                      total:
                        type: integer
                        description: Total published variables in the catalog (refreshed every few minutes)
                      limit:
                        type: integer
                      offset:
                        type: integer
                        description: Position of the first row of this page in the whole result list (0-based)
                      page:
                        type: integer
                        description: Page number; on a page reached by cursor, worked out from `offset`
                      max_offset:
                        type: integer
                        nullable: true
                        description: Results reachable by `page`; past them, use the cursors. Null when unlimited.
                      next_cursor:
                        type: string
                        nullable: true
                        description: Cursor of the next page; null on the last page
                      prev_cursor:
                        type: string
                        nullable: true
                        description: Cursor of the previous page; null on the first page
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            uid:
                              type: integer
                            vid:
                              type: string
                            fid:
                              type: string
                            name:
                              type: string
                            labl:
                              type: string
                            qstn:
                              type: string
                            sid:
                              type: integer
                            study:
                              type: object
                              properties:
                                id:
                                  type: integer
                                idno:
                                  type: string
                                title:
                                  type: string
                                nation:
                                  type: string
                  params:
                    type: object
        "400":
          description: >-
            Bad input. A paging error carries `error_code`: `page_out_of_range` (a page past `max_offset`, with
            `max_offset`; page further with `next_cursor`) or `cursor_invalid` (the cursor is not one of this search;
            start again from the first page).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorErrors"
                  - $ref: "#/components/schemas/PagingError"

  /catalog/{IDNo}/variables:
    get:
      tags:
        - Catalog
        - Metadata
      summary: List or search variables by study
      description: >-
        Without `sk`: all variables of the study, paged by `page` and `ps` (default 100 per page, up to 1,000).
        With `sk`: a keyword search within the study's variables (default 15 per page, up to 100), with the
        same paging rules as [Search variables](#operation/searchVariables), including `cursor`.


        To find variables by data file, use [Variables by data file](#operation/listDataFileVariables).
        For catalog-wide variable search (without an IDNo), use [Search variables](#operation/searchVariables).
        This response has no `status` field.
      operationId: listVariables
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - name: sk
          in: query
          description: Keyword search within the study's variables (name, label, question text)
          schema:
            type: string
        - name: sort_by
          in: query
          description: "Sort results when `sk` is provided. Valid options: `name`, `labl`"
          schema:
            type: string
            enum: [name, labl]
        - name: sort_order
          in: query
          description: Sort direction, when `sk` is provided
          schema:
            type: string
            enum: [asc, desc]
        - name: ps
          in: query
          description: >-
            Results per page. Without `sk`: 1 to 1,000, default 100 (values outside the range give 100).
            With `sk`: 1 to 100 (larger values give 100), default 15.
          schema:
            type: integer
        - name: page
          in: query
          description: Page number. With `sk`, for the first `max_offset` results.
          schema:
            type: integer
        - name: cursor
          in: query
          description: >-
            With `sk` only: `next_cursor` or `prev_cursor` of the previous page of this search, in place of
            `page`, to page past `max_offset` results
          schema:
            type: string
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: >-
            Without `sk`: `{ found, total, limit, offset, page, variables[] }`, where `found` equals `total`.
            With `sk`: the same fields plus `found_is_lower_bound`, `max_offset`, `next_cursor` and `prev_cursor`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: integer
                    description: Variables matching the keyword (equals `total` without `sk`)
                  found_is_lower_bound:
                    type: boolean
                    description: With `sk` only. True when `found` is a lower bound (a very broad search)
                  total:
                    type: integer
                    description: Total variables in the study
                  limit:
                    type: integer
                  offset:
                    type: integer
                  page:
                    type: integer
                  max_offset:
                    type: integer
                    nullable: true
                    description: With `sk` only. Results reachable by `page`; null when unlimited
                  next_cursor:
                    type: string
                    nullable: true
                    description: With `sk` only
                  prev_cursor:
                    type: string
                    nullable: true
                    description: With `sk` only
                  variables:
                    type: array
                    description: >-
                      Without `sk`, items have `uid`, `sid`, `fid`, `vid`, `name`, `labl`. With `sk`, items have
                      `uid`, `vid`, `fid`, `name`, `labl`, `qstn` and `file_name`.
                    items:
                      $ref: "#/components/schemas/VariableListItem"
        "400":
          description: >-
            `STUDY_NOT_FOUND`, a study ID error, or (with `sk`) a paging error with `error_code`
            (`page_out_of_range` or `cursor_invalid`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - $ref: "#/components/schemas/PagingError"

  /catalog/{IDNo}/variables/{varId}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get a single variable
      description: >-
        Full metadata for a single variable. The same variable is returned by
        `/catalog/{IDNo}/variable/{varId}` and by `/catalog/variables?idno={IDNo}&var_id={varId}`.
        This response has no `status` field.
      operationId: findSingleVariable
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - name: varId
          in: path
          description: Variable ID (`vid`, e.g. `V1`)
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  variable:
                    $ref: "#/components/schemas/Variable"
        "400":
          description: "`VARIABLE-NOT-FOUND`, `MISSING_PARAM::VAR_ID`, or a study ID error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /catalog/{IDNo}/resources:
    get:
      tags:
        - Metadata
      summary: List study resources
      description: >-
        External resources of a study (questionnaires, reports, data files, links), sorted by title. For
        studies with licensed data access, microdata resources are left out. The same list is returned by
        `/catalog/resources/{IDNo}`.
      operationId: listResources
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  total:
                    type: integer
                  resources:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudyResource"
        "400":
          description: A study ID error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/{IDNo}/resources/{resourceId}/pdf-stream:
    get:
      tags:
        - Metadata
      summary: Stream a PDF resource
      description: >-
        Returns a PDF resource of the study inline (`Content-Disposition: inline`), for viewing in the
        browser, e.g. with PDF.js. Only resources stored on the site are streamed, not external URLs. The same
        access rules apply as for downloading the file: resources of studies with public or licensed access
        need a signed-in user, and licensed files need an approved request.
      operationId: streamPdfResource
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - name: resourceId
          in: path
          required: true
          description: Resource ID (`resource_id`)
          schema:
            type: integer
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: The PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            `RESOURCE_ID_NOT_PROVIDED`, `RESOURCE_NOT_FOUND`, `RESOURCE_NOT_PDF_STREAMABLE` (not a PDF, or an
            external URL), `FILE_NOT_AVAILABLE`, `RESOURCE_FILE_NOT_FOUND`, `LOGIN_REQUIRED`, a permission
            error, or a study ID error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/ddi/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Download DDI/XML
      description: >-
        DDI 2.5 CodeBook XML, sent as a download (`Content-Type: application/octet-stream`,
        `Content-Disposition: attachment; filename="{IDNo}.xml"`). Available for microdata (`survey`) studies
        only.
      operationId: downloadDDI
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: The DDI XML file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: "`DDI is only available for Survey/MICRODATA types`, `IDNO_NOT_FOUND`, or a study ID error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/json/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Download JSON
      description: >-
        The study's full metadata as JSON (or JSON Lines), for all study types: study metadata, data files,
        variables and, optionally, resources.
      operationId: downloadJSON
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - name: format
          in: query
          description: "`json` (default) or `jsonl` (JSON Lines)"
          schema:
            type: string
            enum: [json, jsonl]
        - name: pretty
          in: query
          description: "`true` or `1` to pretty-print (JSON format only)"
          schema:
            type: string
            enum: ["true", "1"]
        - name: download
          in: query
          description: "`true` or `1` to send the file as a download (`Content-Disposition: attachment`)"
          schema:
            type: string
            enum: ["true", "1"]
        - name: include_resources
          in: query
          description: "`true` or `1` to include the study's resources as `external_resources`"
          schema:
            type: string
            enum: ["true", "1"]
        - name: dsd_export
          in: query
          description: >-
            Timeseries studies only: `reference` (default) refers to the data structure definition;
            `inline` includes the full definition, its components and codelists
          schema:
            type: string
            enum: [reference, inline]
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
            application/x-ndjson:
              schema:
                type: string
                description: JSON Lines, with `format=jsonl`
        "400":
          description: A study ID error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

  /catalog/rdf/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Download resources as RDF
      description: >-
        The study's external resources as RDF/XML (Dublin Core), sent as a download named `study-{IDNo}.rdf`.
      operationId: downloadRDF
      parameters:
        - $ref: "#/components/parameters/IDNo"
        - $ref: "#/components/parameters/id_format"
      responses:
        "200":
          description: Successful operation
          content:
            application/xml:
              schema:
                type: string
        "400":
          description: A study ID error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorErrors"

components:
  parameters:
    IDNo:
      name: IDNo
      in: path
      description: Study IDNo, or the numeric study ID with `id_format=id`
      required: true
      schema:
        type: string
    id_format:
      name: id_format
      in: query
      description: Set to `id` to use the numeric study ID instead of the IDNo
      schema:
        type: string
        enum: [id]

  schemas:
    ErrorMessage:
      type: object
      description: Error body with the error text in `message`
      required: [status, message]
      properties:
        status:
          type: string
          enum: [failed]
        message:
          type: string
          example: IDNO-NOT-FOUND

    ErrorErrors:
      type: object
      description: Error body with the error text in `errors`
      required: [status, errors]
      properties:
        status:
          type: string
          enum: [failed]
        errors:
          type: string
          example: REPOSITORY-NOT-FOUND

    PagingError:
      type: object
      description: >-
        Paging error from a search. Catalog-wide searches also repeat the text in `errors`.
      required: [status, error_code, message]
      properties:
        status:
          type: string
          enum: [failed]
        error_code:
          type: string
          enum: [page_out_of_range, cursor_invalid]
        message:
          type: string
        errors:
          type: string
        max_offset:
          type: integer
          description: With `page_out_of_range`, the number of results reachable by `page`

    IdnoList:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        total:
          type: integer
        records:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: Numeric study ID
              idno:
                type: string
              type:
                type: string
                description: Dataset type

    Study:
      type: object
      description: >-
        A study, as returned by [Get study information](#operation/singleDataset). `created` and `changed`
        are ISO 8601 date-times.
      properties:
        id:
          type: integer
          description: Numeric study ID
        idno:
          type: string
        doi:
          type: string
          nullable: true
        type:
          type: string
          description: Dataset type, e.g. `survey`, `geospatial`, `timeseries`, `document`
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        nation:
          type: string
          description: Country or countries, as one display string
        year_start:
          type: integer
        year_end:
          type: integer
        authoring_entity:
          type: string
          nullable: true
        repositoryid:
          type: string
          description: ID of the collection that owns the study
        data_access_type:
          type: string
          nullable: true
          description: Data access type code, e.g. `open`, `direct`, `public`, `licensed`, `enclave`, `remote`, `data_na`
        remote_data_url:
          type: string
          nullable: true
          description: For remote access, the URL where the data can be requested
        data_class_code:
          type: string
          nullable: true
          description: Data classification code, when classifications are used
        data_class_title:
          type: string
          nullable: true
        published:
          type: integer
          enum: [0, 1]
        created:
          type: string
          format: date-time
        changed:
          type: string
          format: date-time
        varcount:
          type: integer
          nullable: true
          description: Number of variables (microdata)
        total_views:
          type: integer
        total_downloads:
          type: integer
        thumbnail:
          type: string
          nullable: true
          description: Thumbnail file name (use [Get study thumbnail URL](#operation/getThumbnail) for the URL)
        abstract:
          type: string
          nullable: true
        link_study:
          type: string
          nullable: true
        link_indicator:
          type: string
          nullable: true
        link_report:
          type: string
          nullable: true
        metadata:
          type: object
          description: >-
            The study's metadata document, in the JSON schema of its type: `survey-schema.json` for
            microdata, `geospatial-schema.json`, `timeseries-schema.json`, `document-schema.json`, and so on.
            The schemas are served at `/index.php/schemas/{name}`.

