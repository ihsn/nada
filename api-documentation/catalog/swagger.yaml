  CatalogSearchRow:
    type: object
    description: >-
      A single study returned by the catalog search endpoint. All fields are present
      for every dataset type; indicator/timeseries-specific fields (`ts_dimensions`,
      `ts_frequency`, `ts_data_count`, `ts_db_study_id`, `ts_db_title`) are `null`
      for non-timeseries types.
    properties:
      id:
        type: integer
        description: Internal numeric study ID
        example: 47
      idno:
        type: string
        description: Study unique identifier (IDNO)
        example: "WDI_2024"
      type:
        type: string
        description: Dataset type
        example: "timeseries"
      doi:
        type: string
        description: Digital Object Identifier, if assigned
        example: "10.1234/wdi.2024"
        nullable: true
      title:
        type: string
        description: Study title
        example: "World Development Indicators 2024"
      subtitle:
        type: string
        description: Study subtitle
        nullable: true
        example: null
      nation:
        type: string
        description: Primary country or region name
        example: "World"
      authoring_entity:
        type: string
        description: Organisation(s) responsible for producing the dataset
        example: "World Bank"
      abstract:
        type: string
        description: Study abstract or description
        nullable: true
        example: "Annual time series on development indicators for 217 economies."
      year_start:
        type: integer
        description: Start year of the data collection period
        example: 1960
        nullable: true
      year_end:
        type: integer
        description: End year of the data collection period
        example: 2023
        nullable: true
      repositoryid:
        type: string
        description: Repository (collection) ID the study belongs to
        example: "central"
      repo_title:
        type: string
        description: Human-readable title of the repository
        example: "Central Data Catalog"
      thumbnail:
        type: string
        description: Relative path to the study thumbnail image
        nullable: true
        example: "/files/thumbnails/wdi_2024.png"
      link_da:
        type: string
        description: External data access URL, if applicable
        nullable: true
        example: null
      created:
        type: string
        format: date-time
        description: ISO 8601 timestamp when the record was created
        example: "2024-01-15T08:30:00Z"
      changed:
        type: string
        format: date-time
        description: ISO 8601 timestamp when the record was last modified
        example: "2024-06-01T12:00:00Z"
      total_views:
        type: integer
        description: Cumulative page view count
        example: 4821
      total_downloads:
        type: integer
        description: Cumulative file download count
        example: 312
      varcount:
        type: integer
        description: Number of variables associated with the study
        nullable: true
        example: 1400
      data_class_id:
        type: integer
        description: Internal ID of the data classification assigned to this study
        nullable: true
        example: 2
      form_model:
        type: string
        description: Metadata schema / form model used (e.g. `survey`, `timeseries`)
        nullable: true
        example: "timeseries"
      url:
        type: string
        description: Absolute URL to the study detail page
        example: "http://catalog.example.org/catalog/47"
      ts_dimensions:
        type: string
        description: >-
          **Timeseries/indicator datasets only.** Comma-separated list of DSD dimension
          component names (sorted alphabetically) derived from the linked Data Structure
          Definition. These are the axes along which indicator values are disaggregated
          (e.g. country, year, sex). `null` for non-timeseries types or when no DSD
          is linked.
        nullable: true
        example: "country,freq,indicator,sex,year"
      ts_frequency:
        type: string
        description: >-
          **Timeseries/indicator datasets only.** Comma-separated list of periodicity
          codelist titles from the DSD's periodicity component (e.g. `Annual`,
          `Quarterly`). `null` when not applicable or no codelist is defined.
        nullable: true
        example: "Annual"
      ts_data_count:
        type: integer
        description: >-
          **Timeseries/indicator datasets only.** Total number of data observation
          rows stored for this dataset. `null` for non-timeseries types.
        nullable: true
        example: 98420
      ts_db_study_id:
        type: integer
        description: >-
          **Timeseries/indicator datasets only.** Internal ID of the linked timeseries
          database (parent study), if this study belongs to one. `null` otherwise.
        nullable: true
        example: 12
      ts_db_title:
        type: string
        description: >-
          **Timeseries/indicator datasets only.** Title of the linked timeseries
          database (parent study). `null` otherwise.
        nullable: true
        example: "World Bank Open Data"
      iso3:
        type: string
        description: >-
          Comma-separated ISO 3 country codes for countries associated with this study.
          Only present when `inc_iso=1` is passed in the request.
        example: "AFG,IND,KEN"
      countries:
        type: array
        description: >-
          Array of country name objects for countries associated with this study.
          Only present when `inc_countries=1` is passed in the request.
        items:
          type: object
          properties:
            name:
              type: string
              example: "Afghanistan"
      resources:
        type: array
        description: >-
          External resource links attached to this study. Only present when
          `include_resources=true` is passed in the request.
        items:
          type: object
          properties:
            resource_id:
              type: integer
              example: 101
            link:
              type: string
              example: "https://databank.worldbank.org/source/world-development-indicators"
            ext:
              type: string
              example: "url"
            title:
              type: string
              example: "WDI Online Data Portal"
    example:
      id: 47
      idno: "WDI_2024"
      type: "timeseries"
      doi: null
      title: "World Development Indicators 2024"
      subtitle: null
      nation: "World"
      authoring_entity: "World Bank"
      abstract: "Annual time series on development indicators for 217 economies, covering health, education, economy, environment and more."
      year_start: 1960
      year_end: 2023
      repositoryid: "central"
      repo_title: "Central Data Catalog"
      thumbnail: "/files/thumbnails/wdi_2024.png"
      link_da: null
      created: "2024-01-15T08:30:00Z"
      changed: "2024-06-01T12:00:00Z"
      total_views: 4821
      total_downloads: 312
      varcount: 1400
      data_class_id: 2
      form_model: "timeseries"
      url: "http://catalog.example.org/catalog/47"
      ts_dimensions: "country,freq,indicator,sex,year"
      ts_frequency: "Annual"
      ts_data_count: 98420
      ts_db_study_id: 12
      ts_db_title: "World Bank Open Data"

  ApiResponse:
    type: object
    properties:
      code:
        type: integer
        format: int32
      type:
        type: string
      message:
        type: string
