swagger: "2.0"
info:
  description: >-
    The NADA REST API allows searching, browsing and viewing the catalog. Use the metadata endpoints to extract detailed study metadata as JSON. 
    

    Find out more about NADA at
    [http://nada.ihsn.org](http://nada.ihsn.org).  

    
  version: 5.3
  title: NADA API
  x-logo:
    url: ""
    backgroundColor: "#FFFFFF"
    altText: ""
basePath: /index.php/api/
tags:
  - name: Collections
    description: Collections

  - name: Catalog
    description: API to browse, search and explore studies in the catalog

  - name: Metadata
    description: Access metadata and documentation available for the studies in the catalog


x-tagGroups:
  - name: Collections
    tags:
      - Collections
  - name: Catalog
    tags:
      - Catalog
  - name: Metadata
    tags:
      - Metadata    
schemes:
    - http
    - https
paths:

  /catalog/collections:
    get:
      tags:
        - Collections
      summary: List all collections
      description: Returns a list of all collections
      operationId: listCollections
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/Collection"
  /catalog/collections/{repoId}:
    get:
      tags:
        - Collections
      summary: Get a collection
      description: Get info for a single collection
      operationId: SingleCollection      
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      parameters:
        - name: repoId
          in: path
          description: Collection ID
          required: true
          type: string
          format: string        
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/Collection"
  /catalog/search:
    get:
      tags:
        - Catalog
      summary: Search catalog
      description: Search catalog
      operationId: CatalogSearch
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: sk
          in: query
          description: Keywords for searching study level metadata
          type: string
        - name: from
          in: query
          description: Starting year for the data collection
          type: integer
        - name: to
          in: query
          description: End year for the data collection
          type: integer
        - name: country
          in: query
          description: "Provide country name or ISO 3 code. For country names and codes, see endpoint `/api/catalog/country_codes`. For searching multiple countries, provide names separated by pipe(|). \n \n Example `Afghanistan|Indonesia` or `afg|ind` or `afghanistan|ind`"
          type: string
        - name: inc_iso
          in: query
          description: Set the parameter value to true to include the ISO3 country codes for the results
          type: boolean
        - name: collection
          in: query
          description: Filter results by one or more collections. For filtering multiples, use format `collection1, collection2`
          type: string
        - name: created
          in: query
          description: Filter results by date of creation. Use the date format YYYY-MM-DD. Examples, `2020/04/01` returns records created on and after that date. To specify a date range, use the format `2020/04/01-2020/04/20`
          type: string  
        - name: dtype
          in: query
          description: Filter by data access types. For multiple values, use comma e.g. `open, direct, remote`
          type: string
          enum:
          - open
          - direct
          - public
          - licensed
          - enclave
          - remote
          - other 
        - name: ps
          in: query
          description: Number of results per page. Default is 15 records per page
          type: integer
        - name: page
          in: query
          description: Page to return for the search result
          type: integer
        
        - name: sort_by
          in: query
          description: Sort search results. Valid options are `rank`,`title`,`year`,`nation`
          type: string
          enum:
          - rank
          - title
          - nation
          - year
        - name: sort_order
          in: query
          description: Set results sort order. Ascending = `asc`, Descending= `desc`
          type: string
          enum:
          - asc
          - desc
        - name: format
          in: query
          description: Supported formats are `json`, `xml`
          type: string     

            
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/Catalog"
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/ApiResponse"
        "400":
          description: Bad input
  
  /catalog/stats:
    get:
      tags:
        - Catalog
      summary: Catalog headline statistics
      description: >-
        Returns counts of published studies, variables, citations, countries with data,
        and the year range covered by published studies. Results are cached for 10 minutes.
      operationId: catalogStats
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/ApiResponse"

  /catalog/country_codes:
    get:
      tags:
        - Catalog
      summary: List country codes
      description: List of country codes
      operationId: listCountryCodes
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/CountryCode"
  /catalog/latest:
    get:
      tags:
        - Catalog
      summary: Latest catalog entries
      description: Latest studies added to the catalog
      operationId: latestStudies
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/Catalog"
  
  /catalog/data_access_codes:
    get:
      tags:
        - Catalog
      summary: List data access types
      description: Data access types list
      operationId: listDataAccessTypes
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/DataAccessCode"
    
  /catalog/{IDNo}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get study information
      description: "Get study level metadata for a dataset. The study data files and variables metadata can be accessed via the following endpoints. \n \n * [Data files](#operation/listDataFiles) - Metadata for data files \n \n * [Variables](#operation/listDataFileVariables) - Metadata for variables"
      operationId: singleDataset
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          type: string
          required: true
        - name: id_format
          in: query
          description: To use the ID values instead of the IDNo, set id_format to ID
          type: string
          required: false
      responses:
        "200":
          description: successful operation
          schema:
              $ref: "../catalog-admin/survey-schema.json"

  /catalog/{IDNo}/data_files:
    get:
      tags:
        - Catalog
        - Metadata
      summary: List data files
      description: List all data files for a study
      operationId: listDataFiles
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          type: string
          required: true
        - name: id_format
          in: query
          description: To use the ID values instead of the IDNo, set id_format to ID
          type: string
          required: false
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/Catalog"
  /catalog/{IDNo}/data_files/{fileId}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get single data file info
      description: Get metadata for a single data file
      operationId: singleDataFile
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          type: string
          required: true 
        - name: fileId
          in: path
          description: File ID number
          type: string
          required: true
        - name: id_format
          in: query

          description: To use the ID values instead of the IDNo, set id_format to ID
          type: string
          required: false  
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "../catalog-admin/datafile-schema.json"

  /catalog/{IDNo}/data_files/{fileId}/variables:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get variables by data file
      description: Get variables attached to a single data file. To find all variables for a study, use [Variables by data file](#operation/listVariables). 
      operationId: listDataFileVariables
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          type: string
          required: true 
        - name: fileId
          in: path
          description: File ID number
          type: string
          required: true
        - name: id_format
          in: query
          description: To use the ID values instead of the IDNo, set id_format to ID
          type: string
          required: false
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/Catalog"
  
  /catalog/variables:
    get:
      tags:
        - Catalog
      summary: Search variables across catalog
      description: >-
        Search variables across all published studies in the catalog.


        `idno` and `var_id` may be supplied as query parameters instead of URL
        path segments:

        * `/api/catalog/variables?sk=income` — catalog-wide keyword search

        * `/api/catalog/variables?idno=SUR_2020_HH&sk=income` — per-study keyword search

        * `/api/catalog/variables?idno=SUR_2020_HH&var_id=V1` — single variable lookup
      operationId: searchVariables
      produces:
        - application/json
      parameters:
        - name: sk
          in: query
          description: Keyword search across variable names, labels and questions
          type: string
        - name: idno
          in: query
          description: "Study unique ID — when provided, limits the search to that study"
          type: string
          required: false
        - name: var_id
          in: query
          description: Variable ID — returns a single variable when combined with `idno`
          type: string
          required: false
        - name: country
          in: query
          description: "Filter by country name or ISO3 code. Separate multiple values with pipe (|). Example: `Afghanistan|Indonesia` or `afg|idn`"
          type: string
        - name: from
          in: query
          description: Filter by data collection start year
          type: integer
        - name: to
          in: query
          description: Filter by data collection end year
          type: integer
        - name: dtype
          in: query
          description: Filter by data access type
          type: string
          enum:
            - open
            - direct
            - public
            - licensed
            - enclave
            - remote
            - other
        - name: type
          in: query
          description: Filter by dataset type (e.g. `survey`, `geospatial`)
          type: string
        - name: sort_by
          in: query
          description: "Sort results. Valid options: `name`, `labl`, `title`, `nation`"
          type: string
          enum:
            - name
            - labl
            - title
            - nation
        - name: sort_order
          in: query
          description: Sort direction
          type: string
          enum:
            - asc
            - desc
        - name: ps
          in: query
          description: Number of results per page. Default is 15
          type: integer
        - name: page
          in: query
          description: Page number
          type: integer
      responses:
        "200":
          description: successful operation
          schema:
            type: object
            properties:
              result:
                type: object
                properties:
                  found:
                    type: integer
                    description: Number of variables matching the search
                  total:
                    type: integer
                    description: Total published variables in the catalog
                  limit:
                    type: integer
                  offset:
                    type: integer
                  page:
                    type: integer
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: integer
                        vid:
                          type: string
                        fid:
                          type: string
                        name:
                          type: string
                        labl:
                          type: string
                        qstn:
                          type: string
                        sid:
                          type: integer
                        study:
                          type: object
                          properties:
                            id:
                              type: integer
                            idno:
                              type: string
                            title:
                              type: string
                            nation:
                              type: string
              params:
                type: object
        "400":
          description: Bad input

  /catalog/{IDNo}/variables:
    get:
      tags:
        - Catalog
        - Metadata
      summary: List or search variables by study
      description: >-
        List all variables for a study, or search within them using `?sk=`.
        To find variables by data file, use [Variables by data file](#operation/listDataFileVariables).
        For catalog-wide variable search (without an IDNo), use [Search variables](#operation/searchVariables).
      operationId: listVariables
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          type: string
          required: true
        - name: sk
          in: query
          description: Keyword search within the study's variables (name, label, question text)
          type: string
          required: false
        - name: sort_by
          in: query
          description: "Sort results when `sk` is provided. Valid options: `name`, `labl`"
          type: string
          enum:
            - name
            - labl
          required: false
        - name: sort_order
          in: query
          description: Sort direction
          type: string
          enum:
            - asc
            - desc
          required: false
        - name: ps
          in: query
          description: Number of results per page when `sk` is provided. Default is 15
          type: integer
          required: false
        - name: page
          in: query
          description: Page number when `sk` is provided
          type: integer
          required: false
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          type: string
          required: false
      responses:
        "200":
          description: >-
            Without `sk`: `{ found, total, variables[] }`.
            With `sk`: `{ found, total, limit, offset, page, variables[] }`.
          schema:
            type: object
            properties:
              found:
                type: integer
                description: Variables matching the keyword (equals total when no sk)
              total:
                type: integer
                description: Total variables in the study
              limit:
                type: integer
              offset:
                type: integer
              page:
                type: integer
              variables:
                type: array
                items:
                  type: object
                  properties:
                    uid:
                      type: integer
                    vid:
                      type: string
                    fid:
                      type: string
                    name:
                      type: string
                    labl:
                      type: string
                    qstn:
                      type: string

  /catalog/{IDNo}/variables/{varId}:
    get:
      tags:
        - Catalog
        - Metadata
      summary: Get a single variable
      description: >-
        Get full metadata for a single variable.
        Alternatively, supply both `idno` and `var_id` as query parameters to
        `/api/catalog/variables?idno={IDNo}&var_id={varId}`.
      operationId: findSingleVariable
      consumes:
        - application/json
      produces:
        - application/xml
        - application/json
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          type: string
          required: true
        - name: varId
          in: path
          description: Variable ID
          type: string
          required: true
        - name: id_format
          in: query
          description: Set to `id` to use the numeric study ID instead of IDNo
          type: string
          required: false
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "../catalog-admin/variable-schema.json"
  /catalog/ddi/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Download DDI/XML
      description: Download DDI 2.5 CodeBook XML (available for microdata studies only)
      operationId: downloadDDI
      consumes:
        - application/json
      produces:
        - application/xml
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          type: string
          required: true
        - name: id_format
          in: query
          description: To use the ID values instead of the IDNo, set id_format to ID
          type: string
          required: false
      responses:
        "200":
          description: successful operation
  /catalog/json/{IDNo}:
    get:
      tags:
        - Metadata
      summary: Download JSON
      description: Download study metadata as JSON
      operationId: downloadJSON
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: IDNo
          in: path
          description: Study unique ID number
          type: string
          required: true
        - name: id_format
          in: query
          description: To use the ID values instead of the IDNo, set id_format to ID
          type: string
          required: false
      responses:
        "200":
          description: successful operation

definitions:
  Catalog:
    type: object
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      idno:
        type: string        
      title:
        type: string
      nation:
        type: string      
      created:
        type: string
        format: date-time
      changed:
        type: string
        format: date-time
    xml:
      name: Catalog
  Project:
    type: object
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      project_type:
        type: string
        enum:
          - survey
          - geospatial
      title:
        type: string
      description:
        type: string
      shortname:
        type: string
      collaborators:
        type: array
        format: email
        items:
          type: string
        example:
          - user@example.com
          - user2@example.com
      status:
        type: string
        readOnly: true
        description:
          Project status codes

          * `draft` - Draft mode

          * `submitted` - Project is submitted and locked for user to make any further changes

          * `processed` - Project accepted and is being processed

          * `closed` - Processing completed and project is completed

          * `published` - Project published to one or more catalogs

          * `cancelled` - Project was cancelled

        enum:
          - draft
          - submitted
          - processed
          - closed
          - cancelled
          - published
      created:
        type: string
        format: date-time
        readOnly: true         
      changed:
        type: string
        format: date-time
        readOnly: true           
    xml:
      name: Project

  ProjectAccessPolicy:
    type: object
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      access_policy:
        type: string
        description:
          Select the access policy suitable for your data.
          
          * `direct` - Direct access

          * `public` - Public access
          
          * `licensed` - Licensed access, require users to register and submit request for access
          
          * `enclave` - Data Enclave
          
          * `remote` - Date available from remote repository
          
          * `other` - Other

        enum:
          - open
          - direct
          - public
          - licensed
          - enclave
          - remote
          - other
      to_catalog:
        type: string
        description:
          
          Select catalog for publishing the data

          * `internal` - Internal catalog
          
          * `external` -External public catalog
        enum:
          - internal
          - external  
      is_embargoed:
        type: boolean
        description: Is the data embargoed?
        enum:
          - 0 [No]
          - 1 [Yes]
      embargoed_notes:
        type: string
        description: indicate the terms of the embargo e.g. time period and any other special instructions.
      disclosure_risk: 
        type: string      
        description: Safeguarding the identity and privacy of respondents that have provided the data is important. If the data files you are depositing contain any identifying variables (e.g., names, official ID numbers, precise GIS coordinates, etc) or any variables deemed otherwise sensitive in your study setting (e.g., ethnicity, tribe, religion, etc) please list these below so that access to these can be suppressed. 
      library_notes: 
        type: string      
        description: Notes for the deposit reviewers
      cc:
        type: string
        description: Enter the email addresses seperated by semicolon(;) of additional people you would like to receive a summary copy of your submission.
      created:
        type: string
        format: date-time
        readOnly: true         
      changed:
        type: string
        format: date-time
        readOnly: true     
    xml:
      name: MetadataSchema    
  Collection:
    type: object
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      repositoryID:
        type: string
        title: Collection unique ID
      title:
        type: string
        title: Collection title
      short_text:
        type: string
        title: Short description
      long_text:
        type: string
        title: Detailed description for the collection in HTML format
      thumbnail:
        type: string
        title: Collection thumbnail          
    xml:
      name: CollectionSchema
  CountryCode:
    type: object
    properties:
      countryid:
        type: integer
        format: int64
      name:
        type: string
        title: Country name
      iso:
        type: string
        title: Country ISO 3 code
    xml:
      name: CountryCodeSchema
  DataAccessCode:
    type: object
    properties:
      type:
        type: string
        title: Data access type
      title:
        type: string
        title: Title
    xml:
      name: DataAccessTypeSchema    
  AuthenticationResponse:
    type: object
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      user_id:
        type: integer
      username:
        type: string
      api-keys:
        type: object  
    xml:
      name: AuthenticationResponse    
  Resource:
    type: object
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      pid:
        type: integer
        format: int64
        description: Project ID
      resource_type:
        type: string
        enum:
          - microdata
          - questionnaire
          - report
          - table
          - other
      title:
        type: string
      description:
        type: string
      filename:
        type: string
      created:
        type: string
        format: date-time
      changed:
        type: string
        format: date-time
    xml:
      name: Resource
  Citation:
    type: object
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      pid:
        type: integer
        format: int64
        description: Project ID
      citation_type:
        type: string
        enum:
          - book
          - journal
          - article
          - website
          - other
      title:
        type: string
      subtitle:
        type: string
      authors:
        type: array
        items:
          type: object
          properties:
            fname:
              type: string
            lname:
              type: string
      volume:
        type: string
      issue:
        type: string
      idnumber:
        type: string
      edition:
        type: string
      pub_place:
        type: string
      publisher:
        type: string
      pub_medium:
        type: string
      url:
        type: string
      page_from:
        type: integer
      page_to:
        type: integer
      pub_date:
        type: string
        example: Full or partial date .e.g Month/Year or Year
      abstract:
        type: string
      keywords:
        type: string
      doi:
        type: string
      country:
        type: string
      created:
        type: string
        format: date-time
      changed:
        type: string
        format: date-time
    required:
      - pid
      - title
    xml:
      name: Citation
  
  
  
  ApiResponse:
    type: object
    properties:
      code:
        type: integer
        format: int32
      type:
        type: string
      message:
        type: string
