swagger: "2.0"
info:
  description: >-
    The Downloads API lists and downloads files for one published study.
    

    Find out more about NADA at
    [http://github.com/ihsn/nada](http://github.com/ihsn/nada).  

    
  version: 1.0.0
  title: Downloads API
  x-logo:
    url: ""
    backgroundColor: "#FFFFFF"
    altText: ""
# Note: host and schemes are automatically injected by swagger.php
# based on the current server configuration
basePath: /index.php/api/
tags:
  - name: Downloads
    description: API for browsing and downloading study resources

x-tagGroups:
  - name: Downloads
    tags:
      - Downloads
paths:

  /downloads/files/{idno}:
    get:
      tags:
        - Downloads
      summary: List downloadable files by study
      description: >-
        Files for one published study that the caller is allowed to download.
        Documentation is included. Microdata is included for open or direct
        access, for a public-use request with accepted terms, or for an
        approved licensed request for that file.
      operationId: listFilesByStudy
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: idno
          in: path
          description: Study unique ID number (IDNO)
          type: string
          required: true
        - name: type
          in: query
          description: >-
            Resource type filter. Can be a category (microdata, data, documentation, doc) 
            or a specific code (doc/qst, dat/micro, tbl, etc.)
          type: string
      responses:
        "200":
          description: successful operation
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              files:
                type: array
                items:
                  $ref: "#/definitions/DownloadableFile"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ErrorResponse"

  /downloads/info/{idno}/{resource_id}:
    get:
      tags:
        - Downloads
      summary: Get downloadable file information
      description: Get detailed information for a single downloadable file
      operationId: getFileInfo
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: idno
          in: path
          description: Study unique ID number (IDNO)
          type: string
          required: true
        - name: resource_id
          in: path
          description: Resource ID
          type: integer
          required: true
      responses:
        "200":
          description: successful operation
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              resource:
                $ref: "#/definitions/DownloadableFile"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ErrorResponse"

  /downloads/download/{idno}/{resource_id}:
    get:
      tags:
        - Downloads
      summary: Download a file
      description: >-
        Download a file by study IDNO and resource ID. 
        Authentication is required for public and licensed data access types.
        User must have appropriate permissions to download the file.
      operationId: downloadFile
      produces:
        - application/octet-stream
        - application/json
      parameters:
        - name: idno
          in: path
          description: Study unique ID number (IDNO)
          type: string
          required: true
        - name: resource_id
          in: path
          description: Resource ID
          type: integer
          required: true
      responses:
        "200":
          description: File download successful
          schema:
            type: file
        "400":
          description: Bad request or insufficient permissions
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: Login required
          schema:
            $ref: "#/definitions/ErrorResponse"

definitions:
  DownloadableFile:
    type: object
    properties:
      resource_id:
        type: integer
        description: Unique resource ID
      survey_id:
        type: integer
        description: Study/survey ID
      idno:
        type: string
        description: Study IDNO
      title:
        type: string
        description: Study title
      dctype:
        type: string
        description: Resource type code (e.g., doc/qst, dat/micro, tbl)
      dcformat:
        type: string
        description: File format (e.g., application/pdf, application/x-stata)
      filename:
        type: string
        description: File name
      file_size:
        type: integer
        description: File size in bytes
      data_access_type:
        type: string
        description: Data access type
        enum:
          - open
          - direct
          - public
          - licensed
          - enclave
          - remote
          - other
      countries:
        type: array
        items:
          type: string
        description: Countries covered by the study
      year_start:
        type: integer
        description: Start year of data collection
      year_end:
        type: integer
        description: End year of data collection
      download_url:
        type: string
        description: URL to download the file
    xml:
      name: DownloadableFile
  
  ErrorResponse:
    type: object
    properties:
      status:
        type: string
        example: failed
      errors:
        type: string
        description: Error message
    xml:
      name: ErrorResponse

